# Default values for NimbusGuard
# This is a YAML-formatted file.

global:
  # Global image settings
  imageRegistry: ""
  imagePullSecrets: []
  
# Namespace configuration
namespace:
  create: true
  name: nimbusguard

# Consumer application settings
consumer:
  enabled: true
  replicaCount: 1
  
  image:
    repository: nimbusguard-consumer
    tag: latest
    pullPolicy: IfNotPresent
  
  service:
    type: ClusterIP
    port: 8000
    
  resources:
    requests:
      memory: "128Mi"
      cpu: "100m"
    limits:
      memory: "256Mi"
      cpu: "200m"
      
  # OpenTelemetry configuration
  otel:
    serviceName: "nimbusguard-consumer"
    version: "1.0.0"
    tracesEndpoint: "http://alloy:4318/v1/traces"
    metricsEndpoint: "http://alloy:4318/v1/metrics"
    logsEndpoint: "http://alloy:4318/v1/logs"

# Monitoring stack configuration
monitoring:
  enabled: true
  
  # Prometheus configuration
  prometheus:
    enabled: true
    image:
      repository: prom/prometheus
      tag: v2.55.1
    
    service:
      type: ClusterIP
      port: 9090
      
    resources:
      requests:
        memory: "512Mi"
        cpu: "200m"
      limits:
        memory: "1Gi"
        cpu: "500m"
        
    retention: "200h"
    
  # Grafana configuration
  grafana:
    enabled: true
    image:
      repository: grafana/grafana
      tag: 12.0.1
      
    service:
      type: ClusterIP
      port: 3000
      
    adminPassword: "admin"
    
    resources:
      requests:
        memory: "256Mi"
        cpu: "100m"
      limits:
        memory: "512Mi"
        cpu: "200m"
        
  # Loki configuration
  loki:
    enabled: true
    image:
      repository: grafana/loki
      tag: 3.5.1
      
    service:
      type: ClusterIP
      port: 3100
      
    resources:
      requests:
        memory: "256Mi"
        cpu: "100m"
      limits:
        memory: "512Mi"
        cpu: "200m"
        
    retention: "744h"  # 31 days
    
  # Tempo configuration
  tempo:
    enabled: true
    image:
      repository: grafana/tempo
      tag: 2.8.1
      
    service:
      type: ClusterIP
      ports:
        http: 3200
        otlpGrpc: 4317
        otlpHttp: 4318
        
    resources:
      requests:
        memory: "256Mi"
        cpu: "100m"
      limits:
        memory: "512Mi"
        cpu: "200m"
        
  # Alloy (OpenTelemetry Collector) configuration
  alloy:
    enabled: true
    image:
      repository: grafana/alloy
      tag: v1.9.0
      
    service:
      type: ClusterIP
      ports:
        metrics: 8080
        otlpGrpc: 4317
        otlpHttp: 4318
        
    resources:
      requests:
        memory: "256Mi"
        cpu: "100m"
      limits:
        memory: "512Mi"
        cpu: "300m"
        
  # Beyla (eBPF auto-instrumentation) configuration
  beyla:
    enabled: true
    image:
      repository: grafana/beyla
      tag: 1.9.3
      
    # Ports to monitor
    openPort: "8000"
    logLevel: "debug"
    metricsInterval: "30s"
    
    resources:
      requests:
        memory: "100Mi"
        cpu: "100m"
      limits:
        memory: "200Mi"
        cpu: "200m"
        
  # Node Exporter configuration
  nodeExporter:
    enabled: true
    image:
      repository: prom/node-exporter
      tag: v1.9.0
      
    service:
      type: ClusterIP
      port: 9100
      
    resources:
      requests:
        memory: "64Mi"
        cpu: "50m"
      limits:
        memory: "128Mi"
        cpu: "100m"
        
  # Kube State Metrics configuration
  kubeStateMetrics:
    enabled: true
    image:
      repository: registry.k8s.io/kube-state-metrics/kube-state-metrics
      tag: v2.15.0
      
    service:
      type: ClusterIP
      ports:
        metrics: 8080
        telemetry: 8081
        
    resources:
      requests:
        memory: "64Mi"
        cpu: "50m"
      limits:
        memory: "128Mi"
        cpu: "100m"

# KEDA (Kubernetes Event Driven Autoscaling) configuration
keda:
  enabled: true
  
  # ScaledObject configuration
  scaledObject:
    enabled: true
    name: consumer-scaledobject
    
    # Scaling parameters
    minReplicaCount: 1
    maxReplicaCount: 15
    pollingInterval: 30
    cooldownPeriod: 300
    
    # Scaling behavior
    scaleUp:
      stabilizationWindowSeconds: 60
      maxPercentValue: 50
      periodSeconds: 60
      
    scaleDown:
      stabilizationWindowSeconds: 300
      maxPercentValue: 10
      periodSeconds: 60
    
    # Prometheus-based triggers
    triggers:
      - name: http_requests_rate
        type: prometheus
        threshold: "5"
        query: "sum(rate(http_requests_total{instance=\"consumer:8000\"}[1m]))"
        
      - name: http_request_duration_avg
        type: prometheus
        threshold: "2"
        query: "sum(rate(http_request_duration_seconds_sum{instance=\"consumer:8000\"}[1m])) / sum(rate(http_request_duration_seconds_count{instance=\"consumer:8000\"}[1m]))"
        
      - name: python_gc_rate
        type: prometheus
        threshold: "0.5"
        query: "sum(rate(python_gc_collections_total{instance=\"consumer:8000\"}[1m]))"

# Load Generator configuration
loadGenerator:
  enabled: false  # Disabled by default, enable for testing
  
  image:
    repository: nimbusguard-generator
    tag: latest
    pullPolicy: IfNotPresent
    
  # Available test types: light, medium, heavy, sustained, burst, cpu_stress, memory_stress
  testTypes:
    light:
      enabled: false
      activeDeadlineSeconds: 300
    medium:
      enabled: false
      activeDeadlineSeconds: 480
    heavy:
      enabled: false
      activeDeadlineSeconds: 600
    sustained:
      enabled: false
      activeDeadlineSeconds: 1800
    burst:
      enabled: false
      activeDeadlineSeconds: 300
    memoryStress:
      enabled: false
      activeDeadlineSeconds: 600
    cpuStress:
      enabled: false
      activeDeadlineSeconds: 600
      
  resources:
    requests:
      memory: "128Mi"
      cpu: "100m"
    limits:
      memory: "256Mi"
      cpu: "200m"

# Security and RBAC
rbac:
  create: true

serviceAccount:
  create: true
  automount: true

# Pod Security
podSecurityContext: {}

securityContext: {}

# Node selection
nodeSelector: {}

tolerations: []

affinity: {}

# Startup probes and health checks
startupProbe:
  enabled: true
  initialDelaySeconds: 30
  periodSeconds: 10

livenessProbe:
  enabled: true
  initialDelaySeconds: 30
  periodSeconds: 10

readinessProbe:
  enabled: true
  initialDelaySeconds: 5
  periodSeconds: 5 