# Default values for NimbusGuard Helm chart.
# This file is a YAML-formatted file.
# Declare variables to be passed into your templates.

# Global settings
global:
  namespace: nimbusguard
  commonLabels:
    app.kubernetes.io/name: nimbusguard
    app.kubernetes.io/part-of: nimbusguard
    app.kubernetes.io/component: operator

# CRD Configuration
crd:
  enabled: true

# Operator Configuration
operator:
  enabled: true
  image:
    repository: nimbusguard/nimbusguard-operator
    tag: latest
    pullPolicy: Always
  replicaCount: 1
  
  # Resource patches from original Kustomize configuration
  resources:
    requests:
      memory: "128Mi"
      cpu: "100m"
    limits:
      memory: "512Mi"
      cpu: "500m"
  
  # Wait for operator to be ready before installing workloads
  waitForReady: true
  waitTimeout: "300s"
  
  # Service configuration
  service:
    type: ClusterIP
    port: 8090
    targetPort: 8090
    name: metrics
  
  # ConfigMap settings
  config:
    logLevel: "INFO"
    metricsPort: "8090"
  
  # Service Account
  serviceAccount:
    create: true
    name: nimbusguard-operator
  
  # RBAC
  rbac:
    create: true
  
  # Security settings
  securityContext: {}
  nodeSelector: {}
  tolerations: []
  affinity: {}

# Consumer Workload Configuration
consumerWorkload:
  enabled: true
  image:
    repository: nimbusguard/consumer-workload
    tag: latest
    pullPolicy: Always
  replicaCount: 1
  
  resources:
    requests:
      memory: "128Mi"
      cpu: "100m"
    limits:
      memory: "256Mi"
      cpu: "200m"
  
  # Service configuration
  service:
    type: ClusterIP
    port: 8080
    targetPort: 8080
    name: http
  
  # Environment variables
  env:
    logLevel: "INFO"
    otelExporterOtlpEndpoint: "http://tempo:4317"
    otelServiceName: "consumer-workload"
    otelResourceAttributes: "service.name=consumer-workload,service.version=1.0.0"
    kafkaBootstrapServers: "kafka:9092"
    kafkaTopic: "scaling-events"
    kafkaConsumerGroup: "background-consumer"
  
  # Probes
  livenessProbe:
    httpGet:
      path: /health
      port: 8080
    initialDelaySeconds: 30
    periodSeconds: 10
  
  readinessProbe:
    httpGet:
      path: /health
      port: 8080
    initialDelaySeconds: 5
    periodSeconds: 5
  
  # Intelligent Scaling Configuration
  intelligentScaling:
    enabled: true
    name: consumer-scaler
    targetLabels:
      app: consumer-workload
    metricsConfig:
      prometheusUrl: "http://prometheus.monitoring.svc:9090"
      evaluationInterval: 30
      decisionWindow: "5m"
      metrics:
        - query: nimbusguard_cpu_usage_percent
          threshold: 50
          condition: gt
        - query: nimbusguard_memory_usage_percent
          threshold: 70
          condition: gt
  
  nodeSelector: {}
  tolerations: []
  affinity: {}

# Kafka Configuration
kafka:
  enabled: true
  image:
    repository: bitnami/kafka
    tag: "3.5"
    pullPolicy: IfNotPresent
  replicaCount: 1
  
  # StatefulSet configuration
  statefulSet:
    serviceName: kafka
  
  resources:
    requests:
      memory: "256Mi"
      cpu: "100m"
    limits:
      memory: "1Gi"
      cpu: "500m"
  
  # Service configuration
  service:
    type: ClusterIP
    port: 9092
    targetPort: kafka
    name: kafka
  
  # Kafka environment configuration
  config:
    nodeId: "1"
    processRoles: "broker,controller"
    controllerQuorumVoters: "1@kafka-0.kafka.nimbusguard.svc.cluster.local:9093"
    listeners: "PLAINTEXT://:9092,CONTROLLER://:9093"
    listenerSecurityProtocolMap: "CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT"
    advertisedListeners: "PLAINTEXT://kafka-0.kafka.nimbusguard.svc.cluster.local:9092"
    controllerListenerNames: "CONTROLLER"
    interBrokerListenerName: "PLAINTEXT"
    allowPlaintextListener: "yes"
    autoCreateTopicsEnable: "true"
  
  # Storage configuration
  persistence:
    enabled: false  # Set to true for production
    storageClass: "local-storage"
    size: "10Gi"
    path: "/data/kafka"
    nodeAffinity:
      hostname: "docker-desktop"
  
  nodeSelector: {}
  tolerations: []
  affinity: {}

# KEDA Configuration
keda:
  enabled: true
  
  # ScaledObject configuration
  scaledObject:
    name: consumer-workload-scaler
    scaleTargetRef:
      name: consumer-workload
      kind: Deployment
    pollingInterval: 10
    cooldownPeriod: 120
    minReplicaCount: 1
    maxReplicaCount: 10
    
    # Kafka trigger configuration
    triggers:
      kafka:
        enabled: true
        metadata:
          bootstrapServers: "kafka.nimbusguard.svc.cluster.local:9092"
          consumerGroup: "background-consumer"
          topic: "scaling-events"
          lagThreshold: "5"
          activationLagThreshold: "2"
          offsetResetPolicy: "earliest"
          allowIdleConsumers: "true"
          scaleToZeroOnInvalidOffset: "false"
  
  # Trigger Authentication
  triggerAuthentication:
    name: kafka-trigger-auth
    secretTargetRef: []
  
  # Network Policies
  networkPolicies:
    enabled: true
    kedaNamespace: keda

# Load Generator Configuration
loadGenerator:
  enabled: false  # Disabled by default, enable for testing
  image:
    repository: nimbusguard/load-generator
    tag: latest
    pullPolicy: Always
  replicaCount: 1
  
  resources:
    requests:
      memory: "64Mi"
      cpu: "50m"
    limits:
      memory: "128Mi"
      cpu: "100m"
  
  # Service configuration
  service:
    type: ClusterIP
    port: 8081
    targetPort: 8081
    name: http
  
  # Environment variables
  env:
    logLevel: "INFO"
    targetUrl: "http://consumer-workload:8080"
    requestRate: "10"
    otelExporterOtlpEndpoint: "http://tempo:4317"
    otelServiceName: "load-generator"
    otelResourceAttributes: "service.name=load-generator,service.version=1.0.0"
  
  # Probes
  livenessProbe:
    httpGet:
      path: /health
      port: 8081
    initialDelaySeconds: 30
    periodSeconds: 10
  
  readinessProbe:
    httpGet:
      path: /health
      port: 8081
    initialDelaySeconds: 5
    periodSeconds: 5
  
  nodeSelector: {}
  tolerations: []
  affinity: {}

# Helm Chart Dependencies Configuration
dependencies:
  # KEDA for event-driven autoscaling
  keda:
    enabled: true
    useJob: false  # Set to true to install KEDA via Helm job instead of chart dependency
    version: "2.15.1"  # Version to install if using job approach
    
  # Prometheus for metrics collection
  prometheus:
    enabled: false  # Disabled because we use custom Prometheus by default
    server:
      persistentVolume:
        enabled: false
      service:
        type: ClusterIP
        
  # Grafana for visualization dashboards
  grafana:
    enabled: false  # Disabled because we use custom Grafana by default
    adminPassword: "admin"
    service:
      type: ClusterIP
      
  # Alloy (Grafana Agent) for observability
  alloy:
    enabled: false  # Disabled by default, enable if you want Alloy for log/trace collection

# Custom Monitoring Stack Configuration
# These components will be installed as templates rather than dependencies
monitoring:
  # Enable all monitoring components by default
  enabled: true
  
  # Namespace for monitoring components
  namespace: monitoring
  
  # Prometheus configuration
  prometheus:
    enabled: true
    scrape: true
    port: "8080"
    path: "/metrics"
    url: "http://prometheus.monitoring.svc.cluster.local:9090"
    isDefault: true
    image:
      repository: prom/prometheus
      tag: "v2.47.0"
      pullPolicy: IfNotPresent
    resources:
      requests:
        cpu: 100m
        memory: 256Mi
      limits:
        cpu: 500m
        memory: 1Gi
    config:
      global:
        scrape_interval: 15s
        evaluation_interval: 15s
        external_labels:
          cluster: 'nimbusguard-dev'
      retention: "200h"
  
  # Grafana configuration  
  grafana:
    enabled: true
    namespace: "monitoring"
    image:
      repository: grafana/grafana
      tag: "10.1.0"
      pullPolicy: IfNotPresent
    adminUser: admin
    adminPassword: admin
    resources:
      requests:
        cpu: 250m
        memory: 750Mi
      limits:
        cpu: 500m
        memory: 1Gi
    plugins:
      - grafana-clock-panel
      - grafana-simple-json-datasource
    
  # Loki configuration
  loki:
    enabled: true
    namespace: "monitoring"
    url: "http://loki.monitoring.svc.cluster.local:3100"
    replicaCount: 1
    image:
      repository: grafana/loki
      tag: "2.9.0"
      pullPolicy: IfNotPresent
    config:
      authEnabled: false
      httpPort: 3100
      grpcPort: 9096
      logLevel: "info"
      pathPrefix: "/tmp/loki"
      chunksDirectory: "/tmp/loki/chunks"
      rulesDirectory: "/tmp/loki/rules"
      replicationFactor: 1
      cacheMaxSizeMb: 100
      schemaFrom: "2020-10-24"
      alertmanagerUrl: "http://localhost:9093"
      ingestionRateMb: 16
      ingestionBurstSizeMb: 24
      reportingEnabled: false
      retentionDeletesEnabled: true
      retentionPeriod: "168h"
      rulePath: "/tmp/loki/rules-temp"
    persistence:
      enabled: false
    service:
      type: ClusterIP
    resources:
      requests:
        cpu: "100m"
        memory: "128Mi"
      limits:
        cpu: "500m"
        memory: "512Mi"
  
  # Tempo configuration
  tempo:
    enabled: true
    namespace: "monitoring"
    url: "http://tempo.monitoring.svc.cluster.local:3200"
    replicaCount: 1
    image:
      repository: grafana/tempo
      tag: "2.2.0"
      pullPolicy: IfNotPresent
    config:
      httpPort: 3200
      logLevel: "info"
      otlpGrpcPort: 4317
      otlpHttpPort: 4318
      jaegerHttpPort: 14268
      jaegerGrpcPort: 14250
      zipkinPort: 9411
      traceIdlePeriod: "10s"
      maxBlockDuration: "5m"
      blockRetention: "1h"
      backend: "local"
      walPath: "/tmp/tempo/wal"
      localPath: "/tmp/tempo/blocks"
      metricsPath: "/tmp/tempo/generator/wal"
    persistence:
      enabled: false
    service:
      type: ClusterIP
    resources:
      requests:
        cpu: "100m"
        memory: "128Mi"
      limits:
        cpu: "500m"
        memory: "512Mi"

# Resource ordering and hooks configuration
hooks:
  # CRDs are installed first
  crd:
    weight: "-10"
    policy: "pre-install,pre-upgrade"
    deletePolicy: "before-hook-creation"
  
  # Operator resources are installed second
  operator:
    weight: "-5"
    policy: "post-install,post-upgrade"
    deletePolicy: "before-hook-creation"
  
  # Wait job ensures operator is ready
  wait:
    weight: "0"
    policy: "post-install,post-upgrade"
    deletePolicy: "before-hook-creation,hook-succeeded"
  
  # Workloads are installed last
  workloads:
    weight: "5"
    policy: "post-install,post-upgrade"
    deletePolicy: "before-hook-creation"
