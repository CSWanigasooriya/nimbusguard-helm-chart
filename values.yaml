# NimbusGuard - Complete AI-Powered Autoscaling System
# This is a YAML-formatted file.

global:
  # Global image settings
  imageRegistry: ""
  imagePullSecrets: []
  
# Namespace configuration
namespace:
  create: true
  name: nimbusguard

# === AI CONFIGURATION ===
ai:
  # OpenAI API configuration for LLM validation
  openai:
    # Set this to your OpenAI API key or use --set ai.openai.apiKey=your_key_here
    apiKey: ""
    model: "gpt-3.5-turbo"
    temperature: 0.1
    
  # AI Features
  enableDetailedReasoning: true
  enableLlmValidation: false  # Disabled for speed optimization
  reasoningLogLevel: "INFO"

# === DQN ADAPTER (CORE AI COMPONENT) ===
dqnAdapter:
  enabled: true
  replicaCount: 1
  
  image:
    repository: nimbusguard-dqn-adapter
    tag: latest
    pullPolicy: Always
    
  service:
    type: ClusterIP
    port: 8080
    
  # DQN Hyperparameters - Research Optimized
  hyperparameters:
    # Exploration Strategy
    epsilonStart: 0.3
    epsilonEnd: 0.05
    epsilonDecay: 0.99  # Faster decay for research
    
    # Training Parameters
    gamma: 0.99
    learningRate: 0.0003  # Increased for faster adaptation
    memoryCapacity: 50000
    minBatchSize: 4       # Reduced for faster training start
    batchSize: 16         # Reduced for more frequent training
    targetBatchSize: 32   # Reduced target batch size
    targetUpdateInterval: 1000
    
    # Neural Network Architecture
    dqnHiddenDims: "512,256,128"
    lstmHiddenDim: 64
    lstmNumLayers: 2
    lstmDropout: 0.2
    lstmSequenceLength: 24
    
    # Reward System
    stabilizationPeriodSeconds: 5  # Reduced for speed optimization
    rewardLatencyWeight: 10.0
    rewardReplicaCost: 0.1
    enableImprovedRewards: true
    
    # Multi-Objective Reward Weights
    rewardPerformanceWeight: 0.40  # 40%
    rewardResourceWeight: 0.30     # 30%
    rewardHealthWeight: 0.20       # 20%
    rewardCostWeight: 0.10         # 10%
    
    # Evaluation & Monitoring
    evaluationInterval: 300        # 5 minutes
    enableEvaluationOutputs: true
    saveIntervalSeconds: 300       # 5 minutes
    
  # Target deployment configuration
  target:
    deployment: "consumer"
    namespace: "nimbusguard"
    pollingInterval: 3
    
  resources:
    requests:
      memory: "512Mi"
      cpu: "250m"
    limits:
      memory: "1Gi"
      cpu: "500m"
      
  # Service account and RBAC
  serviceAccount:
    create: true
    name: ""
    
  rbac:
    create: true

# === CONSUMER APPLICATION ===
consumer:
  enabled: true
  replicaCount: 1
  
  image:
    repository: nimbusguard-consumer
    tag: latest
    pullPolicy: Always
  
  service:
    type: ClusterIP
    port: 8000
    
  resources:
    requests:
      memory: "128Mi"
      cpu: "200m"
    limits:
      memory: "1Gi"  # Increased for memory stress testing
      cpu: "500m"

# === REDIS (STATE STORAGE) ===
redis:
  enabled: true
  
  image:
    repository: redis
    tag: 7-alpine
    pullPolicy: IfNotPresent
    
  service:
    type: ClusterIP
    port: 6379
    
  persistence:
    enabled: true
    size: 1Gi
    
  resources:
    requests:
      memory: "256Mi"
      cpu: "100m"
    limits:
      memory: "512Mi"
      cpu: "200m"

# === MINIO (MODEL STORAGE) ===
minio:
  enabled: true
  
  image:
    repository: minio/minio
    tag: RELEASE.2024-01-16T16-07-38Z
    pullPolicy: IfNotPresent
    
  service:
    type: ClusterIP
    ports:
      api: 9000
      console: 9001
      
  auth:
    rootUser: minioadmin
    rootPassword: minioadmin
    
  persistence:
    enabled: true
    size: 10Gi
    
  resources:
    requests:
      memory: "512Mi"
      cpu: "200m"
    limits:
      memory: "1Gi"
      cpu: "500m"

# === MCP SERVER (KUBERNETES INTEGRATION) ===
mcpServer:
  enabled: true
  
  image:
    repository: nimbusguard-mcp-server
    tag: latest
    pullPolicy: Always
    
  service:
    type: ClusterIP
    port: 8080
    
  resources:
    requests:
      memory: "256Mi"
      cpu: "100m"
    limits:
      memory: "512Mi"
      cpu: "200m"
      
  serviceAccount:
    create: true
    name: ""
    
  rbac:
    create: true

# === MONITORING STACK ===
monitoring:
  enabled: true
  
  # Prometheus configuration
  prometheus:
    enabled: true
    image:
      repository: prom/prometheus
      tag: v2.55.1
      pullPolicy: IfNotPresent
    
    service:
      type: ClusterIP
      port: 9090
      
    resources:
      requests:
        memory: "512Mi"
        cpu: "200m"
      limits:
        memory: "2Gi"
        cpu: "1000m"
        
    retention: "200h"
    
    # Service account and RBAC
    serviceAccount:
      create: true
      name: ""
    rbac:
      create: true
    
  # Grafana configuration
  grafana:
    enabled: true
    image:
      repository: grafana/grafana
      tag: 11.4.0
      pullPolicy: IfNotPresent
      
    service:
      type: ClusterIP
      port: 3000
      
    auth:
      adminUser: admin
      adminPassword: admin
    
    resources:
      requests:
        memory: "256Mi"
        cpu: "100m"
      limits:
        memory: "512Mi"
        cpu: "200m"
        
  # Loki configuration
  loki:
    enabled: true
    image:
      repository: grafana/loki
      tag: 3.5.1
      pullPolicy: IfNotPresent
      
    service:
      type: ClusterIP
      port: 3100
      
    resources:
      requests:
        memory: "256Mi"
        cpu: "100m"
      limits:
        memory: "512Mi"
        cpu: "200m"
        
    retention: "744h"  # 31 days
    
  # Tempo configuration
  tempo:
    enabled: true
    image:
      repository: grafana/tempo
      tag: 2.8.1
      pullPolicy: IfNotPresent
      
    service:
      type: ClusterIP
      ports:
        http: 3200
        otlpGrpc: 4317
        otlpHttp: 4318
        
    resources:
      requests:
        memory: "256Mi"
        cpu: "100m"
      limits:
        memory: "512Mi"
        cpu: "200m"
        
  # Alloy (OpenTelemetry Collector) configuration
  alloy:
    enabled: true
    image:
      repository: grafana/alloy
      tag: v1.9.0
      pullPolicy: IfNotPresent
      
    service:
      type: ClusterIP
      ports:
        metrics: 8080
        otlpGrpc: 4317
        otlpHttp: 4318
        
    resources:
      requests:
        memory: "256Mi"
        cpu: "100m"
      limits:
        memory: "512Mi"
        cpu: "300m"
        
    # Service account and RBAC
    serviceAccount:
      create: true
      name: ""
    rbac:
      create: true
        
  # Beyla (eBPF auto-instrumentation) configuration
  beyla:
    enabled: true
    image:
      repository: grafana/beyla
      tag: 1.9.3
      pullPolicy: IfNotPresent
      
    # Ports to monitor
    openPort: "8000"
    logLevel: "debug"
    metricsInterval: "30s"
    
    service:
      type: ClusterIP
      port: 8080
    
    resources:
      requests:
        memory: "100Mi"
        cpu: "100m"
      limits:
        memory: "200Mi"
        cpu: "200m"
        
    # Service account and RBAC
    serviceAccount:
      create: true
      name: ""
    rbac:
      create: true
        
  # Node Exporter configuration
  nodeExporter:
    enabled: true
    image:
      repository: prom/node-exporter
      tag: v1.9.0
      pullPolicy: IfNotPresent
      
    service:
      type: ClusterIP
      port: 9100
      
    resources:
      requests:
        memory: "64Mi"
        cpu: "50m"
      limits:
        memory: "128Mi"
        cpu: "100m"
        
  # Kube State Metrics configuration
  kubeStateMetrics:
    enabled: true
    image:
      repository: registry.k8s.io/kube-state-metrics/kube-state-metrics
      tag: v2.15.0
      pullPolicy: IfNotPresent
      
    service:
      type: ClusterIP
      ports:
        metrics: 8080
        telemetry: 8081
        
    resources:
      requests:
        memory: "64Mi"
        cpu: "50m"
      limits:
        memory: "128Mi"
        cpu: "100m"
        
    # Service account and RBAC
    serviceAccount:
      create: true
      name: ""
    rbac:
      create: true

# === KEDA (KUBERNETES EVENT DRIVEN AUTOSCALING) ===
keda:
  enabled: true
  
  # ScaledObject configuration
  scaledObject:
    enabled: true
    name: nimbusguard-scaler
    
    # Target deployment
    target:
      deployment: consumer
      
    # Scaling parameters
    minReplicaCount: 1
    maxReplicaCount: 15
    pollingInterval: 5  # Fast polling for competitive response
    cooldownPeriod: 30  # Faster cooldown for research
    
    # Scaling behavior
    scaleUp:
      stabilizationWindowSeconds: 30
      maxPercentValue: 100
      periodSeconds: 15
      
    scaleDown:
      stabilizationWindowSeconds: 60
      maxPercentValue: 10
      periodSeconds: 15
    
    # DQN-based external scaler
    triggers:
      - name: dqn-external-scaler
        type: external
        metadata:
          scalerAddress: "dqn-adapter.nimbusguard.svc.cluster.local:8080"
          scalerType: "dqn-scaler"
          threshold: "1"

# === DASHBOARDS ===
dashboards:
  enabled: true
  
  # Research dashboards for evaluation
  research:
    enabled: true
    
  # Operational dashboards
  operational:
    enabled: true

# === LOAD GENERATOR ===
loadGenerator:
  enabled: false  # Disabled by default, enable for testing
  
  image:
    repository: nimbusguard-generator
    tag: latest
    pullPolicy: Always
    
  # Available test types
  testTypes:
    light:
      enabled: false
      activeDeadlineSeconds: 300
    medium:
      enabled: false
      activeDeadlineSeconds: 480
    heavy:
      enabled: false
      activeDeadlineSeconds: 600
    sustained:
      enabled: false
      activeDeadlineSeconds: 1800
    burst:
      enabled: false
      activeDeadlineSeconds: 300
    memoryStress:
      enabled: false
      activeDeadlineSeconds: 600
    cpuStress:
      enabled: false
      activeDeadlineSeconds: 600
      
  resources:
    requests:
      memory: "128Mi"
      cpu: "100m"
    limits:
      memory: "256Mi"
      cpu: "200m"

# === SECURITY AND RBAC ===
rbac:
  create: true

serviceAccount:
  create: true
  automount: true

# === POD SECURITY ===
podSecurityContext:
  runAsNonRoot: true
  runAsUser: 1000
  fsGroup: 2000

securityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: false
  capabilities:
    drop:
    - ALL

# === NODE SELECTION ===
nodeSelector: {}

tolerations: []

affinity: {}

# === HEALTH CHECKS ===
startupProbe:
  enabled: true
  initialDelaySeconds: 30
  periodSeconds: 10
  timeoutSeconds: 5
  failureThreshold: 10

livenessProbe:
  enabled: true
  initialDelaySeconds: 30
  periodSeconds: 30
  timeoutSeconds: 10
  failureThreshold: 3

readinessProbe:
  enabled: true
  initialDelaySeconds: 5
  periodSeconds: 10
  timeoutSeconds: 5
  failureThreshold: 3 