{{- if .Values.operator.enabled }}
{{/* Operator Service Account */}}
{{- if .Values.operator.serviceAccount.create }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "nimbusguard.serviceAccountName" . }}
  namespace: {{ include "nimbusguard.namespace" . }}
  labels:
    {{- include "nimbusguard.operatorLabels" . | nindent 4 }}
  annotations:
    {{- include "nimbusguard.operatorHookAnnotations" . | nindent 4 }}
{{- end }}
---
{{/* Operator Cluster Role */}}
{{- if .Values.operator.rbac.create }}
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ include "nimbusguard.fullname" . }}-operator
  labels:
    {{- include "nimbusguard.operatorLabels" . | nindent 4 }}
  annotations:
    {{- include "nimbusguard.operatorHookAnnotations" . | nindent 4 }}
rules:
  - apiGroups: ["apiextensions.k8s.io"]
    resources: ["customresourcedefinitions"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["nimbusguard.io"]
    resources: ["intelligentscaling"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  - apiGroups: ["nimbusguard.io"]
    resources: ["intelligentscaling/status"]
    verbs: ["get", "update", "patch"]
  - apiGroups: ["apps"]
    resources: ["deployments", "statefulsets"]
    verbs: ["get", "list", "watch", "update", "patch"]
  - apiGroups: [""]
    resources: ["pods", "services", "configmaps"]
    verbs: ["get", "list", "watch"]
  - apiGroups: [""]
    resources: ["events"]
    verbs: ["create", "patch", "update"]
{{- end }}
---
{{/* Operator Cluster Role Binding */}}
{{- if .Values.operator.rbac.create }}
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ include "nimbusguard.fullname" . }}-operator
  labels:
    {{- include "nimbusguard.operatorLabels" . | nindent 4 }}
  annotations:
    {{- include "nimbusguard.operatorHookAnnotations" . | nindent 4 }}
subjects:
  - kind: ServiceAccount
    name: {{ include "nimbusguard.serviceAccountName" . }}
    namespace: {{ include "nimbusguard.namespace" . }}
roleRef:
  kind: ClusterRole
  name: {{ include "nimbusguard.fullname" . }}-operator
  apiGroup: rbac.authorization.k8s.io
{{- end }}
---
{{/* Operator ConfigMap */}}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "nimbusguard.fullname" . }}-operator-config
  namespace: {{ include "nimbusguard.namespace" . }}
  labels:
    {{- include "nimbusguard.operatorLabels" . | nindent 4 }}
  annotations:
    {{- include "nimbusguard.operatorHookAnnotations" . | nindent 4 }}
data:
  LOG_LEVEL: {{ .Values.operator.config.logLevel | quote }}
  METRICS_PORT: {{ .Values.operator.config.metricsPort | quote }}
---
{{/* Operator Deployment */}}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "nimbusguard.fullname" . }}-operator
  namespace: {{ include "nimbusguard.namespace" . }}
  labels:
    {{- include "nimbusguard.operatorLabels" . | nindent 4 }}
  annotations:
    {{- include "nimbusguard.operatorHookAnnotations" . | nindent 4 }}
spec:
  replicas: {{ .Values.operator.replicaCount }}
  selector:
    matchLabels:
      {{- include "nimbusguard.operatorSelectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "nimbusguard.operatorLabels" . | nindent 8 }}
    spec:
      serviceAccountName: {{ include "nimbusguard.serviceAccountName" . }}
      securityContext:
        {{- toYaml .Values.operator.securityContext | nindent 8 }}
      containers:
        - name: operator
          image: "{{ .Values.operator.image.repository }}:{{ .Values.operator.image.tag }}"
          imagePullPolicy: {{ .Values.operator.image.pullPolicy }}
          ports:
            - containerPort: {{ .Values.operator.service.targetPort }}
              name: metrics
          env:
            - name: LOG_LEVEL
              valueFrom:
                configMapKeyRef:
                  name: {{ include "nimbusguard.fullname" . }}-operator-config
                  key: LOG_LEVEL
            - name: METRICS_PORT
              valueFrom:
                configMapKeyRef:
                  name: {{ include "nimbusguard.fullname" . }}-operator-config
                  key: METRICS_PORT
            - name: OPENAI_API_KEY
              valueFrom:
                secretKeyRef:
                  name: operator-secrets
                  key: openai_api_key
                  optional: true
          resources:
            {{- toYaml .Values.operator.resources | nindent 12 }}
      nodeSelector:
        {{- toYaml .Values.operator.nodeSelector | nindent 8 }}
      tolerations:
        {{- toYaml .Values.operator.tolerations | nindent 8 }}
      affinity:
        {{- toYaml .Values.operator.affinity | nindent 8 }}
---
{{/* Operator Service */}}
apiVersion: v1
kind: Service
metadata:
  name: {{ include "nimbusguard.fullname" . }}-operator
  namespace: {{ include "nimbusguard.namespace" . }}
  labels:
    {{- include "nimbusguard.operatorLabels" . | nindent 4 }}
  annotations:
    {{- include "nimbusguard.operatorHookAnnotations" . | nindent 4 }}
spec:
  type: {{ .Values.operator.service.type }}
  ports:
    - port: {{ .Values.operator.service.port }}
      targetPort: {{ .Values.operator.service.targetPort }}
      name: {{ .Values.operator.service.name }}
  selector:
    {{- include "nimbusguard.operatorSelectorLabels" . | nindent 4 }}
{{- end }}
