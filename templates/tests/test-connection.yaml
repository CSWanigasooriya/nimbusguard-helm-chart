apiVersion: v1
kind: Pod
metadata:
  name: {{ include "nimbusguard.fullname" . }}-test-connection
  namespace: {{ include "nimbusguard.namespace" . }}
  labels:
    {{- include "nimbusguard.labels" . | nindent 4 }}
    test: connection
  annotations:
    "helm.sh/hook": test
    "helm.sh/hook-weight": "10"
    "helm.sh/hook-delete-policy": before-hook-creation,hook-succeeded
spec:
  restartPolicy: Never
  containers:
    - name: test-connection
      image: curlimages/curl:latest
      command: 
        - /bin/sh
        - -c
        - |
          echo "🧪 Testing NimbusGuard deployment..."
          
          {{- if .Values.operator.enabled }}
          echo "📡 Testing operator service connectivity..."
          if curl -f -s http://{{ include "nimbusguard.fullname" . }}-operator:{{ .Values.operator.service.port }}/metrics; then
            echo "✅ Operator metrics endpoint is accessible"
          else
            echo "❌ Failed to connect to operator metrics endpoint"
            exit 1
          fi
          {{- end }}
          
          {{- if .Values.consumerWorkload.enabled }}
          echo "🔍 Testing consumer workload service..."
          if curl -f -s http://{{ include "nimbusguard.fullname" . }}-consumer-workload:{{ .Values.consumerWorkload.service.port }}/health; then
            echo "✅ Consumer workload health endpoint is accessible"
          else
            echo "❌ Failed to connect to consumer workload health endpoint"
            exit 1
          fi
          {{- end }}
          
          {{- if .Values.kafka.enabled }}
          echo "🏪 Testing Kafka connectivity..."
          if nc -z {{ include "nimbusguard.fullname" . }}-kafka {{ .Values.kafka.service.port }}; then
            echo "✅ Kafka service is accessible"
          else
            echo "❌ Failed to connect to Kafka service"
            exit 1
          fi
          {{- end }}
          
          {{- if .Values.loadGenerator.enabled }}
          echo "⚡ Testing load generator service..."
          if curl -f -s http://{{ include "nimbusguard.fullname" . }}-load-generator:{{ .Values.loadGenerator.service.port }}/health; then
            echo "✅ Load generator health endpoint is accessible"
          else
            echo "❌ Failed to connect to load generator health endpoint"
            exit 1
          fi
          {{- end }}
          
          echo "🎉 All NimbusGuard services are healthy and accessible!"
          echo "✨ Test completed successfully!"
