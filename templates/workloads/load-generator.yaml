{{- if .Values.loadGenerator.enabled }}
{{/* Load Generator Deployment */}}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "nimbusguard.fullname" . }}-load-generator
  namespace: {{ include "nimbusguard.namespace" . }}
  labels:
    {{- include "nimbusguard.loadGeneratorLabels" . | nindent 4 }}
  annotations:
    {{- include "nimbusguard.workloadHookAnnotations" . | nindent 4 }}
spec:
  replicas: {{ .Values.loadGenerator.replicaCount }}
  selector:
    matchLabels:
      {{- include "nimbusguard.loadGeneratorSelectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "nimbusguard.loadGeneratorLabels" . | nindent 8 }}
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8081"
        prometheus.io/path: "/metrics"
    spec:
      containers:
        - name: generator
          image: "{{ .Values.loadGenerator.image.repository }}:{{ .Values.loadGenerator.image.tag }}"
          imagePullPolicy: {{ .Values.loadGenerator.image.pullPolicy }}
          ports:
            - containerPort: {{ .Values.loadGenerator.service.targetPort }}
              name: metrics
          env:
            - name: LOG_LEVEL
              value: {{ .Values.loadGenerator.env.logLevel | quote }}
            - name: TARGET_URL
              value: {{ .Values.loadGenerator.env.targetUrl | quote }}
            - name: REQUEST_RATE
              value: {{ .Values.loadGenerator.env.requestRate | quote }}
            - name: OTEL_EXPORTER_OTLP_ENDPOINT
              value: {{ .Values.loadGenerator.env.otelExporterOtlpEndpoint | quote }}
            - name: OTEL_SERVICE_NAME
              value: {{ .Values.loadGenerator.env.otelServiceName | quote }}
            - name: OTEL_RESOURCE_ATTRIBUTES
              value: {{ .Values.loadGenerator.env.otelResourceAttributes | quote }}
          resources:
            {{- toYaml .Values.loadGenerator.resources | nindent 12 }}
          livenessProbe:
            {{- toYaml .Values.loadGenerator.livenessProbe | nindent 12 }}
          readinessProbe:
            {{- toYaml .Values.loadGenerator.readinessProbe | nindent 12 }}
      nodeSelector:
        {{- toYaml .Values.loadGenerator.nodeSelector | nindent 8 }}
      tolerations:
        {{- toYaml .Values.loadGenerator.tolerations | nindent 8 }}
      affinity:
        {{- toYaml .Values.loadGenerator.affinity | nindent 8 }}
---
{{/* Load Generator Service */}}
apiVersion: v1
kind: Service
metadata:
  name: {{ include "nimbusguard.fullname" . }}-load-generator
  namespace: {{ include "nimbusguard.namespace" . }}
  labels:
    {{- include "nimbusguard.loadGeneratorLabels" . | nindent 4 }}
  annotations:
    {{- include "nimbusguard.workloadHookAnnotations" . | nindent 4 }}
spec:
  type: {{ .Values.loadGenerator.service.type }}
  selector:
    {{- include "nimbusguard.loadGeneratorSelectorLabels" . | nindent 4 }}
  ports:
    - name: {{ .Values.loadGenerator.service.name }}
      port: {{ .Values.loadGenerator.service.port }}
      targetPort: {{ .Values.loadGenerator.service.targetPort }}
      protocol: TCP
{{- end }}
