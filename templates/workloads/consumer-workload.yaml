{{- if .Values.consumerWorkload.enabled }}
{{/* Consumer Workload Deployment */}}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "nimbusguard.fullname" . }}-consumer-workload
  namespace: {{ include "nimbusguard.namespace" . }}
  labels:
    {{- include "nimbusguard.consumerWorkloadLabels" . | nindent 4 }}
  annotations:
    {{- include "nimbusguard.workloadHookAnnotations" . | nindent 4 }}
spec:
  replicas: {{ .Values.consumerWorkload.replicaCount }}
  selector:
    matchLabels:
      {{- include "nimbusguard.consumerWorkloadSelectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "nimbusguard.consumerWorkloadLabels" . | nindent 8 }}
      annotations:
        {{- include "nimbusguard.prometheusAnnotations" . | nindent 8 }}
    spec:
      containers:
        - name: consumer
          image: "{{ .Values.consumerWorkload.image.repository }}:{{ .Values.consumerWorkload.image.tag }}"
          imagePullPolicy: {{ .Values.consumerWorkload.image.pullPolicy }}
          ports:
            - containerPort: {{ .Values.consumerWorkload.service.targetPort }}
              name: metrics
          env:
            - name: LOG_LEVEL
              value: {{ .Values.consumerWorkload.env.logLevel | quote }}
            - name: OTEL_EXPORTER_OTLP_ENDPOINT
              value: {{ .Values.consumerWorkload.env.otelExporterOtlpEndpoint | quote }}
            - name: OTEL_SERVICE_NAME
              value: {{ .Values.consumerWorkload.env.otelServiceName | quote }}
            - name: OTEL_RESOURCE_ATTRIBUTES
              value: {{ .Values.consumerWorkload.env.otelResourceAttributes | quote }}
            - name: KAFKA_BOOTSTRAP_SERVERS
              value: {{ .Values.consumerWorkload.env.kafkaBootstrapServers | quote }}
            - name: KAFKA_TOPIC
              value: {{ .Values.consumerWorkload.env.kafkaTopic | quote }}
            - name: KAFKA_CONSUMER_GROUP
              value: {{ .Values.consumerWorkload.env.kafkaConsumerGroup | quote }}
          resources:
            {{- toYaml .Values.consumerWorkload.resources | nindent 12 }}
          livenessProbe:
            {{- toYaml .Values.consumerWorkload.livenessProbe | nindent 12 }}
          readinessProbe:
            {{- toYaml .Values.consumerWorkload.readinessProbe | nindent 12 }}
      nodeSelector:
        {{- toYaml .Values.consumerWorkload.nodeSelector | nindent 8 }}
      tolerations:
        {{- toYaml .Values.consumerWorkload.tolerations | nindent 8 }}
      affinity:
        {{- toYaml .Values.consumerWorkload.affinity | nindent 8 }}
---
{{/* Consumer Workload Service */}}
apiVersion: v1
kind: Service
metadata:
  name: {{ include "nimbusguard.fullname" . }}-consumer-workload
  namespace: {{ include "nimbusguard.namespace" . }}
  labels:
    {{- include "nimbusguard.consumerWorkloadLabels" . | nindent 4 }}
  annotations:
    {{- include "nimbusguard.workloadHookAnnotations" . | nindent 4 }}
spec:
  type: {{ .Values.consumerWorkload.service.type }}
  selector:
    {{- include "nimbusguard.consumerWorkloadSelectorLabels" . | nindent 4 }}
  ports:
    - name: {{ .Values.consumerWorkload.service.name }}
      port: {{ .Values.consumerWorkload.service.port }}
      targetPort: {{ .Values.consumerWorkload.service.targetPort }}
      protocol: TCP
---
{{/* Consumer Workload Intelligent Scaling Configuration */}}
{{- if .Values.consumerWorkload.intelligentScaling.enabled }}
apiVersion: nimbusguard.io/v1alpha1
kind: IntelligentScaling
metadata:
  name: {{ .Values.consumerWorkload.intelligentScaling.name }}
  namespace: {{ include "nimbusguard.namespace" . }}
  labels:
    {{- include "nimbusguard.consumerWorkloadLabels" . | nindent 4 }}
  annotations:
    {{- include "nimbusguard.workloadHookAnnotations" . | nindent 4 }}
spec:
  namespace: {{ include "nimbusguard.namespace" . }}
  target_labels:
    {{- toYaml .Values.consumerWorkload.intelligentScaling.targetLabels | nindent 4 }}
  metrics_config:
    prometheus_url: {{ .Values.consumerWorkload.intelligentScaling.metricsConfig.prometheusUrl | quote }}
    evaluation_interval: {{ .Values.consumerWorkload.intelligentScaling.metricsConfig.evaluationInterval }}
    decision_window: {{ .Values.consumerWorkload.intelligentScaling.metricsConfig.decisionWindow | quote }}
    metrics:
      {{- toYaml .Values.consumerWorkload.intelligentScaling.metricsConfig.metrics | nindent 6 }}
{{- end }}
{{- end }}
