{{- if .Values.kafka.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "nimbusguard.fullname" . }}-kafka
  labels:
    {{- include "nimbusguard.labels" . | nindent 4 }}
  annotations:
    "helm.sh/hook": pre-install,pre-upgrade
    "helm.sh/hook-weight": "3"
spec:
  replicas: {{ .Values.kafka.replicaCount }}
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ include "nimbusguard.name" . }}
      app.kubernetes.io/component: kafka
  template:
    metadata:
      labels:
        {{- include "nimbusguard.labels" . | nindent 8 }}
        app.kubernetes.io/component: kafka
    spec:
      containers:
        - name: kafka
          image: "{{ .Values.kafka.image.repository }}:{{ .Values.kafka.image.tag }}"
          imagePullPolicy: {{ .Values.kafka.image.pullPolicy }}
          resources:
            {{- toYaml .Values.kafka.resources | nindent 12 }}
      nodeSelector:
        {{- toYaml .Values.kafka.nodeSelector | nindent 8 }}
      tolerations:
        {{- toYaml .Values.kafka.tolerations | nindent 8 }}
      affinity:
        {{- toYaml .Values.kafka.affinity | nindent 8 }}
{{- end }}
