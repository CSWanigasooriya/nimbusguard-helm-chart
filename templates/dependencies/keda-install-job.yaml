{{- if and .Values.dependencies.keda.enabled .Values.dependencies.keda.useJob }}
{{/* Alternative: Install KEDA via Helm job (instead of chart dependency) */}}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "nimbusguard.fullname" . }}-keda-installer
  namespace: {{ include "nimbusguard.namespace" . }}
  labels:
    {{- include "nimbusguard.labels" . | nindent 4 }}
  annotations:
    "helm.sh/hook": pre-install,pre-upgrade
    "helm.sh/hook-weight": "-15"
    "helm.sh/hook-delete-policy": before-hook-creation,hook-succeeded
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ include "nimbusguard.fullname" . }}-keda-installer
  labels:
    {{- include "nimbusguard.labels" . | nindent 4 }}
  annotations:
    "helm.sh/hook": pre-install,pre-upgrade
    "helm.sh/hook-weight": "-15"
    "helm.sh/hook-delete-policy": before-hook-creation,hook-succeeded
rules:
  - apiGroups: [""]
    resources: ["namespaces"]
    verbs: ["get", "list", "create", "patch"]
  - apiGroups: ["apiextensions.k8s.io"]
    resources: ["customresourcedefinitions"]
    verbs: ["get", "list", "create", "patch", "update"]
  - apiGroups: ["apps"]
    resources: ["deployments", "replicasets"]
    verbs: ["get", "list", "create", "patch", "update"]
  - apiGroups: [""]
    resources: ["services", "serviceaccounts", "configmaps", "secrets"]
    verbs: ["get", "list", "create", "patch", "update"]
  - apiGroups: ["rbac.authorization.k8s.io"]
    resources: ["clusterroles", "clusterrolebindings", "roles", "rolebindings"]
    verbs: ["get", "list", "create", "patch", "update"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ include "nimbusguard.fullname" . }}-keda-installer
  labels:
    {{- include "nimbusguard.labels" . | nindent 4 }}
  annotations:
    "helm.sh/hook": pre-install,pre-upgrade
    "helm.sh/hook-weight": "-15"
    "helm.sh/hook-delete-policy": before-hook-creation,hook-succeeded
subjects:
  - kind: ServiceAccount
    name: {{ include "nimbusguard.fullname" . }}-keda-installer
    namespace: {{ include "nimbusguard.namespace" . }}
roleRef:
  kind: ClusterRole
  name: {{ include "nimbusguard.fullname" . }}-keda-installer
  apiGroup: rbac.authorization.k8s.io
---
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ include "nimbusguard.fullname" . }}-install-keda
  namespace: {{ include "nimbusguard.namespace" . }}
  labels:
    {{- include "nimbusguard.labels" . | nindent 4 }}
  annotations:
    "helm.sh/hook": pre-install,pre-upgrade
    "helm.sh/hook-weight": "-15"
    "helm.sh/hook-delete-policy": before-hook-creation,hook-succeeded
spec:
  template:
    metadata:
      labels:
        {{- include "nimbusguard.labels" . | nindent 8 }}
        job: install-keda
    spec:
      serviceAccountName: {{ include "nimbusguard.fullname" . }}-keda-installer
      restartPolicy: Never
      containers:
      - name: install-keda
        image: alpine/helm:latest
        command:
        - /bin/sh
        - -c
        - |
          echo "🚀 Installing KEDA via Helm job..."
          
          # Add KEDA Helm repository
          helm repo add kedacore https://kedacore.github.io/charts
          helm repo update
          
          # Check if KEDA is already installed
          if helm list -n keda | grep -q "keda"; then
            echo "✅ KEDA is already installed, checking for updates..."
            helm upgrade keda kedacore/keda \
              --namespace keda \
              --version {{ .Values.dependencies.keda.version | default "2.15.1" }} \
              --wait --timeout=300s
            echo "✅ KEDA updated successfully!"
          else
            echo "📦 Installing KEDA..."
            helm install keda kedacore/keda \
              --namespace keda \
              --create-namespace \
              --version {{ .Values.dependencies.keda.version | default "2.15.1" }} \
              --wait --timeout=300s
            echo "✅ KEDA installed successfully!"
          fi
          
          # Verify KEDA installation
          echo "🔍 Verifying KEDA installation..."
          kubectl wait --for=condition=available --timeout=300s deployment/keda-operator -n keda
          kubectl wait --for=condition=available --timeout=300s deployment/keda-operator-metrics-apiserver -n keda
          
          echo "🎉 KEDA is ready for NimbusGuard!"
{{- end }}
