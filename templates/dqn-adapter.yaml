{{- if .Values.dqnAdapter.enabled }}
---
# OpenAI API Key Secret
apiVersion: v1
kind: Secret
metadata:
  name: openai-api-key
  namespace: {{ .Values.namespace.name }}
  labels:
    {{- include "nimbusguard.labels" . | nindent 4 }}
    component: dqn-adapter
type: Opaque
data:
  key: {{ .Values.ai.openai.apiKey | b64enc }}
---
# DQN Adapter Service Account
{{- if .Values.dqnAdapter.serviceAccount.create }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "nimbusguard.dqnAdapter.serviceAccountName" . }}
  namespace: {{ .Values.namespace.name }}
  labels:
    {{- include "nimbusguard.labels" . | nindent 4 }}
    component: dqn-adapter
automountServiceAccountToken: {{ .Values.serviceAccount.automount }}
{{- end }}
---
# DQN Adapter RBAC
{{- if .Values.dqnAdapter.rbac.create }}
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ include "nimbusguard.fullname" . }}-dqn-adapter
  labels:
    {{- include "nimbusguard.labels" . | nindent 4 }}
    component: dqn-adapter
rules:
  - apiGroups: [""]
    resources: ["pods", "services", "endpoints"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["apps"]
    resources: ["deployments", "deployments/scale"]
    verbs: ["get", "list", "watch", "patch", "update"]
  - apiGroups: ["keda.sh"]
    resources: ["scaledobjects", "scaledobjects/status"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  - apiGroups: ["metrics.k8s.io"]
    resources: ["pods", "nodes"]
    verbs: ["get", "list"]
  - apiGroups: [""]
    resources: ["events"]
    verbs: ["get", "list", "watch", "create", "update", "patch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ include "nimbusguard.fullname" . }}-dqn-adapter
  labels:
    {{- include "nimbusguard.labels" . | nindent 4 }}
    component: dqn-adapter
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: {{ include "nimbusguard.fullname" . }}-dqn-adapter
subjects:
  - kind: ServiceAccount
    name: {{ include "nimbusguard.dqnAdapter.serviceAccountName" . }}
    namespace: {{ .Values.namespace.name }}
{{- end }}
---
# DQN Adapter Service
apiVersion: v1
kind: Service
metadata:
  name: dqn-adapter
  namespace: {{ .Values.namespace.name }}
  labels:
    {{- include "nimbusguard.labels" . | nindent 4 }}
    component: dqn-adapter
spec:
  type: {{ .Values.dqnAdapter.service.type }}
  ports:
    - port: {{ .Values.dqnAdapter.service.port }}
      targetPort: 8080
      protocol: TCP
      name: http
  selector:
    {{- include "nimbusguard.selectorLabels" . | nindent 4 }}
    component: dqn-adapter
---
# DQN Adapter Deployment
apiVersion: apps/v1
kind: Deployment
metadata:
  name: dqn-adapter
  namespace: {{ .Values.namespace.name }}
  labels:
    {{- include "nimbusguard.labels" . | nindent 4 }}
    component: dqn-adapter
spec:
  replicas: {{ .Values.dqnAdapter.replicaCount }}
  selector:
    matchLabels:
      {{- include "nimbusguard.selectorLabels" . | nindent 6 }}
      component: dqn-adapter
  template:
    metadata:
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8080"
        prometheus.io/path: "/metrics"
      labels:
        {{- include "nimbusguard.selectorLabels" . | nindent 8 }}
        component: dqn-adapter
    spec:
      serviceAccountName: {{ include "nimbusguard.dqnAdapter.serviceAccountName" . }}
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      containers:
      - name: adapter
        image: "{{ .Values.dqnAdapter.image.repository }}:{{ .Values.dqnAdapter.image.tag }}"
        imagePullPolicy: {{ .Values.dqnAdapter.image.pullPolicy }}
        ports:
        - containerPort: 8080
          name: metrics
        env:
        # OpenAI API key for LLM validation
        - name: OPENAI_API_KEY
          valueFrom:
            secretKeyRef:
              name: openai-api-key
              key: key
        # Service URLs
        - name: PROMETHEUS_URL
          value: "http://prometheus.{{ .Values.namespace.name }}.svc:9090"
        - name: MCP_SERVER_URL
          value: "http://mcp-server.{{ .Values.namespace.name }}.svc:8080"
        - name: REDIS_URL
          value: "redis://redis.{{ .Values.namespace.name }}.svc:6379"
        
        # === AI MODEL CONFIGURATION ===
        - name: AI_MODEL
          value: {{ .Values.ai.openai.model | quote }}
        - name: AI_TEMPERATURE
          value: {{ .Values.ai.openai.temperature | quote }}
        
        # === EXPLAINABLE AI CONFIGURATION ===
        - name: ENABLE_DETAILED_REASONING
          value: {{ .Values.ai.enableDetailedReasoning | quote }}

        - name: ENABLE_LLM_VALIDATION
          value: {{ .Values.ai.enableLlmValidation | quote }}
        
        # === DQN EXPLORATION STRATEGY ===
        - name: EPSILON_START
          value: {{ .Values.dqnAdapter.hyperparameters.epsilonStart | quote }}
        - name: EPSILON_END
          value: {{ .Values.dqnAdapter.hyperparameters.epsilonEnd | quote }}
        - name: EPSILON_DECAY
          value: {{ .Values.dqnAdapter.hyperparameters.epsilonDecay | quote }}
        
        # === DQN TRAINING HYPERPARAMETERS ===
        - name: GAMMA
          value: {{ .Values.dqnAdapter.hyperparameters.gamma | quote }}
        - name: LEARNING_RATE
          value: {{ .Values.dqnAdapter.hyperparameters.learningRate | quote }}
        - name: MEMORY_CAPACITY
          value: {{ .Values.dqnAdapter.hyperparameters.memoryCapacity | quote }}
        - name: MIN_BATCH_SIZE
          value: {{ .Values.dqnAdapter.hyperparameters.minBatchSize | quote }}
        - name: BATCH_SIZE
          value: {{ .Values.dqnAdapter.hyperparameters.batchSize | quote }}
        - name: TARGET_BATCH_SIZE
          value: {{ .Values.dqnAdapter.hyperparameters.targetBatchSize | quote }}
        - name: TARGET_UPDATE_INTERVAL
          value: {{ .Values.dqnAdapter.hyperparameters.targetUpdateInterval | quote }}
        
        # === NEURAL NETWORK ARCHITECTURE ===
        - name: DQN_HIDDEN_DIMS
          value: {{ .Values.dqnAdapter.hyperparameters.dqnHiddenDims | quote }}
        
        # === REWARD SYSTEM CONFIGURATION ===
        - name: STABILIZATION_PERIOD_SECONDS
          value: {{ .Values.dqnAdapter.hyperparameters.stabilizationPeriodSeconds | quote }}


        
        # === LLM REWARD SYSTEM ===
        # Pure LLM-based rewards - no hardcoded weights needed
        
        # === EVALUATION & MONITORING ===
        - name: SAVE_INTERVAL_SECONDS
          value: {{ .Values.dqnAdapter.hyperparameters.saveIntervalSeconds | quote }}
        
        # === DEPLOYMENT CONFIGURATION ===
        - name: POLLING_INTERVAL
          value: {{ .Values.dqnAdapter.target.pollingInterval | quote }}
        - name: TARGET_DEPLOYMENT
          value: {{ .Values.dqnAdapter.target.deployment | quote }}
        - name: TARGET_NAMESPACE
          value: {{ .Values.dqnAdapter.target.namespace | quote }}
        - name: PYTHONUNBUFFERED
          value: "1"
        
        {{- if .Values.readinessProbe.enabled }}
        readinessProbe:
          exec:
            command:
            - timeout
            - "5"
            - curl
            - "-f"
            - "http://localhost:8080/healthz"
          initialDelaySeconds: {{ .Values.readinessProbe.initialDelaySeconds }}
          periodSeconds: {{ .Values.readinessProbe.periodSeconds }}
          timeoutSeconds: {{ .Values.readinessProbe.timeoutSeconds }}
          failureThreshold: {{ .Values.readinessProbe.failureThreshold }}
        {{- end }}
        
        {{- if .Values.livenessProbe.enabled }}
        livenessProbe:
          exec:
            command:
            - timeout
            - "5"
            - curl
            - "-f"
            - "http://localhost:8080/healthz"
          initialDelaySeconds: {{ .Values.livenessProbe.initialDelaySeconds }}
          periodSeconds: {{ .Values.livenessProbe.periodSeconds }}
          timeoutSeconds: {{ .Values.livenessProbe.timeoutSeconds }}
          failureThreshold: {{ .Values.livenessProbe.failureThreshold }}
        {{- end }}
        
        resources:
          {{- toYaml .Values.dqnAdapter.resources | nindent 10 }}
        
        securityContext:
          {{- toYaml .Values.securityContext | nindent 10 }}
          
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
{{- end }} 