{{- if .Values.monitoring.prometheus.enabled }}
{{/* Custom Prometheus deployment when not using chart dependency */}}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "nimbusguard.fullname" . }}-prometheus
  namespace: {{ .Values.monitoring.namespace | default "monitoring" }}
  labels:
    {{- include "nimbusguard.labels" . | nindent 4 }}
    app.kubernetes.io/component: prometheus
  annotations:
    {{- include "nimbusguard.workloadHookAnnotations" . | nindent 4 }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ include "nimbusguard.fullname" . }}-prometheus
  labels:
    {{- include "nimbusguard.labels" . | nindent 4 }}
    app.kubernetes.io/component: prometheus
  annotations:
    {{- include "nimbusguard.workloadHookAnnotations" . | nindent 4 }}
rules:
  - apiGroups: [""]
    resources:
      - nodes
      - nodes/proxy
      - services
      - endpoints
      - pods
    verbs: ["get", "list", "watch"]
  - apiGroups: ["extensions"]
    resources:
      - ingresses
    verbs: ["get", "list", "watch"]
  - nonResourceURLs: ["/metrics"]
    verbs: ["get"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ include "nimbusguard.fullname" . }}-prometheus
  labels:
    {{- include "nimbusguard.labels" . | nindent 4 }}
    app.kubernetes.io/component: prometheus
  annotations:
    {{- include "nimbusguard.workloadHookAnnotations" . | nindent 4 }}
subjects:
  - kind: ServiceAccount
    name: {{ include "nimbusguard.fullname" . }}-prometheus
    namespace: {{ .Values.monitoring.namespace | default "monitoring" }}
roleRef:
  kind: ClusterRole
  name: {{ include "nimbusguard.fullname" . }}-prometheus
  apiGroup: rbac.authorization.k8s.io
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "nimbusguard.fullname" . }}-prometheus-config
  namespace: {{ .Values.monitoring.namespace | default "monitoring" }}
  labels:
    {{- include "nimbusguard.labels" . | nindent 4 }}
    app.kubernetes.io/component: prometheus
  annotations:
    {{- include "nimbusguard.workloadHookAnnotations" . | nindent 4 }}
data:
  prometheus.yml: |
    global:
      scrape_interval: {{ .Values.monitoring.prometheus.config.global.scrape_interval | default "15s" }}
      evaluation_interval: {{ .Values.monitoring.prometheus.config.global.evaluation_interval | default "15s" }}
      external_labels:
        cluster: {{ .Values.monitoring.prometheus.config.global.external_labels.cluster | default "nimbusguard-dev" | quote }}
        instance: "{{ include "nimbusguard.fullname" . }}"
    
    rule_files:
      - "/etc/prometheus/rules/*.yml"
    
    scrape_configs:
      # Prometheus itself
      - job_name: 'prometheus'
        static_configs:
          - targets: ['localhost:9090']
      
      # NimbusGuard services via ServiceMonitor discovery
      - job_name: 'kubernetes-service-endpoints'
        kubernetes_sd_configs:
          - role: endpoints
        relabel_configs:
          - source_labels: [__meta_kubernetes_service_annotation_prometheus_io_scrape]
            action: keep
            regex: true
          - source_labels: [__meta_kubernetes_service_annotation_prometheus_io_path]
            action: replace
            target_label: __metrics_path__
            regex: (.+)
          - source_labels: [__address__, __meta_kubernetes_service_annotation_prometheus_io_port]
            action: replace
            regex: ([^:]+)(?::\d+)?;(\d+)
            replacement: $1:$2
            target_label: __address__
          - action: labelmap
            regex: __meta_kubernetes_service_label_(.+)
          - source_labels: [__meta_kubernetes_namespace]
            action: replace
            target_label: kubernetes_namespace
          - source_labels: [__meta_kubernetes_service_name]
            action: replace
            target_label: kubernetes_name
      
      # Kubernetes pods
      - job_name: 'kubernetes-pods'
        kubernetes_sd_configs:
          - role: pod
        relabel_configs:
          - source_labels: [__meta_kubernetes_pod_annotation_prometheus_io_scrape]
            action: keep
            regex: true
          - source_labels: [__meta_kubernetes_pod_annotation_prometheus_io_path]
            action: replace
            target_label: __metrics_path__
            regex: (.+)
          - source_labels: [__address__, __meta_kubernetes_pod_annotation_prometheus_io_port]
            action: replace
            regex: ([^:]+)(?::\d+)?;(\d+)
            replacement: $1:$2
            target_label: __address__
          - action: labelmap
            regex: __meta_kubernetes_pod_label_(.+)
          - source_labels: [__meta_kubernetes_namespace]
            action: replace
            target_label: kubernetes_namespace
          - source_labels: [__meta_kubernetes_pod_name]
            action: replace
            target_label: kubernetes_pod_name
      
      {{- if .Values.monitoring.tempo.enabled }}
      # Tempo
      - job_name: 'tempo'
        static_configs:
          - targets: ['{{ include "nimbusguard.fullname" . }}-tempo:{{ .Values.monitoring.tempo.config.httpPort | default 3200 }}']
      {{- end }}
      
      {{- if .Values.monitoring.loki.enabled }}
      # Loki
      - job_name: 'loki'
        static_configs:
          - targets: ['{{ include "nimbusguard.fullname" . }}-loki:{{ .Values.monitoring.loki.config.httpPort | default 3100 }}']
      {{- end }}
      
      {{- if .Values.dependencies.alloy.enabled }}
      # Alloy (Grafana Agent)
      - job_name: 'alloy'
        static_configs:
          - targets: ['alloy:12345']
      {{- end }}
---
{{- if .Values.monitoring.prometheus.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "nimbusguard.fullname" . }}-prometheus
  namespace: {{ .Values.monitoring.namespace | default "monitoring" }}
  labels:
    {{- include "nimbusguard.labels" . | nindent 4 }}
    app.kubernetes.io/component: prometheus
  annotations:
    {{- include "nimbusguard.workloadHookAnnotations" . | nindent 4 }}
spec:
  replicas: {{ .Values.monitoring.prometheus.replicaCount | default 1 }}
  selector:
    matchLabels:
      {{- include "nimbusguard.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: prometheus
  template:
    metadata:
      labels:
        {{- include "nimbusguard.labels" . | nindent 8 }}
        app.kubernetes.io/component: prometheus
    spec:
      serviceAccountName: {{ include "nimbusguard.fullname" . }}-prometheus
      containers:
        - name: prometheus
          image: "{{ .Values.monitoring.prometheus.image.repository | default "prom/prometheus" }}:{{ .Values.monitoring.prometheus.image.tag | default "v2.47.0" }}"
          imagePullPolicy: {{ .Values.monitoring.prometheus.image.pullPolicy | default "IfNotPresent" }}
          args:
            - '--config.file=/etc/prometheus/prometheus.yml'
            - '--storage.tsdb.path=/prometheus/'
            - '--web.console.libraries=/etc/prometheus/console_libraries'
            - '--web.console.templates=/etc/prometheus/consoles'
            - '--storage.tsdb.retention.time={{ .Values.monitoring.prometheus.config.retention | default "200h" }}'
            - '--web.enable-lifecycle'
            - '--web.enable-admin-api'
            - '--web.enable-remote-write-receiver'
            - '--web.route-prefix=/'
            - '--web.external-url=http://localhost:9090'
          ports:
            - containerPort: 9090
              name: web
          volumeMounts:
            - name: prometheus-config
              mountPath: /etc/prometheus
            - name: prometheus-storage
              mountPath: /prometheus
            - name: prometheus-rules
              mountPath: /etc/prometheus/rules
          resources:
            {{- toYaml (.Values.monitoring.prometheus.resources | default (dict "requests" (dict "cpu" "100m" "memory" "256Mi") "limits" (dict "cpu" "500m" "memory" "1Gi"))) | nindent 12 }}
          readinessProbe:
            httpGet:
              path: /-/ready
              port: 9090
            initialDelaySeconds: 30
            timeoutSeconds: 30
          livenessProbe:
            httpGet:
              path: /-/healthy
              port: 9090
            initialDelaySeconds: 30
            timeoutSeconds: 30
      volumes:
        - name: prometheus-config
          configMap:
            name: {{ include "nimbusguard.fullname" . }}-prometheus-config
        - name: prometheus-storage
          {{- if .Values.monitoring.prometheus.persistence.enabled }}
          persistentVolumeClaim:
            claimName: {{ include "nimbusguard.fullname" . }}-prometheus-storage
          {{- else }}
          emptyDir: {}
          {{- end }}
        - name: prometheus-rules
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "nimbusguard.fullname" . }}-prometheus
  namespace: {{ .Values.monitoring.namespace | default "monitoring" }}
  labels:
    {{- include "nimbusguard.labels" . | nindent 4 }}
    app.kubernetes.io/component: prometheus
  annotations:
    {{- include "nimbusguard.workloadHookAnnotations" . | nindent 4 }}
spec:
  type: {{ .Values.monitoring.prometheus.service.type | default "ClusterIP" }}
  selector:
    {{- include "nimbusguard.selectorLabels" . | nindent 4 }}
    app.kubernetes.io/component: prometheus
  ports:
    - name: web
      port: 9090
      targetPort: 9090
{{- end }}
{{- end }}
