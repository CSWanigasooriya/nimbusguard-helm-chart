{{- if .Values.monitoring.prometheus.enabled }}
---
# Prometheus Service Account
{{- if .Values.monitoring.prometheus.serviceAccount.create }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "nimbusguard.prometheus.serviceAccountName" . }}
  namespace: {{ .Values.namespace.name }}
  labels:
    {{- include "nimbusguard.labels" . | nindent 4 }}
    component: monitoring
automountServiceAccountToken: {{ .Values.serviceAccount.automount }}
{{- end }}
---
# Prometheus RBAC
{{- if .Values.monitoring.prometheus.rbac.create }}
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ include "nimbusguard.fullname" . }}-prometheus
  labels:
    {{- include "nimbusguard.labels" . | nindent 4 }}
    component: monitoring
rules:
  - apiGroups: [""]
    resources: ["nodes", "nodes/proxy", "services", "endpoints", "pods"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["extensions"]
    resources: ["ingresses"]
    verbs: ["get", "list", "watch"]
  - nonResourceURLs: ["/metrics"]
    verbs: ["get"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ include "nimbusguard.fullname" . }}-prometheus
  labels:
    {{- include "nimbusguard.labels" . | nindent 4 }}
    component: monitoring
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: {{ include "nimbusguard.fullname" . }}-prometheus
subjects:
  - kind: ServiceAccount
    name: {{ include "nimbusguard.prometheus.serviceAccountName" . }}
    namespace: {{ .Values.namespace.name }}
{{- end }}
---
# Prometheus ConfigMap
apiVersion: v1
kind: ConfigMap
metadata:
  name: prometheus-config
  namespace: {{ .Values.namespace.name }}
  labels:
    {{- include "nimbusguard.labels" . | nindent 4 }}
    component: monitoring
data:
  prometheus.yml: |
    global:
      scrape_interval: 15s
      evaluation_interval: 15s

    scrape_configs:
    # Scrape Prometheus itself
    - job_name: 'prometheus'
      static_configs:
      - targets: ['localhost:9090']

    # Receive metrics from Alloy
    - job_name: 'alloy-metrics'
      static_configs:
      - targets: ['alloy:8080']
      
    # Scrape DQN Adapter metrics
    - job_name: 'dqn-adapter'
      static_configs:
      - targets: ['dqn-adapter:8080']
      metrics_path: '/metrics'
      scrape_interval: 5s
      
    # Scrape Consumer metrics  
    - job_name: 'prometheus.scrape.nimbusguard_consumer'
      static_configs:
      - targets: ['consumer:8000']
      metrics_path: '/metrics'
      scrape_interval: 15s
---
# Prometheus Service
apiVersion: v1
kind: Service
metadata:
  name: prometheus
  namespace: {{ .Values.namespace.name }}
  labels:
    {{- include "nimbusguard.labels" . | nindent 4 }}
    component: monitoring
spec:
  type: {{ .Values.monitoring.prometheus.service.type }}
  ports:
    - port: {{ .Values.monitoring.prometheus.service.port }}
      targetPort: 9090
      protocol: TCP
      name: http
  selector:
    {{- include "nimbusguard.selectorLabels" . | nindent 4 }}
    app.kubernetes.io/name: prometheus
---
# Prometheus Deployment
apiVersion: apps/v1
kind: Deployment
metadata:
  name: prometheus
  namespace: {{ .Values.namespace.name }}
  labels:
    {{- include "nimbusguard.labels" . | nindent 4 }}
    component: monitoring
spec:
  replicas: 1
  selector:
    matchLabels:
      {{- include "nimbusguard.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/name: prometheus
  template:
    metadata:
      labels:
        {{- include "nimbusguard.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/name: prometheus
        component: monitoring
    spec:
      serviceAccountName: {{ include "nimbusguard.prometheus.serviceAccountName" . }}
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      containers:
      - name: prometheus
        image: "{{ .Values.monitoring.prometheus.image.repository }}:{{ .Values.monitoring.prometheus.image.tag }}"
        imagePullPolicy: {{ .Values.monitoring.prometheus.image.pullPolicy }}
        ports:
        - containerPort: 9090
          name: http
        args:
        - --config.file=/etc/prometheus/prometheus.yml
        - --storage.tsdb.path=/prometheus/
        - --web.console.libraries=/etc/prometheus/console_libraries
        - --web.console.templates=/etc/prometheus/consoles
        - --storage.tsdb.retention.time={{ .Values.monitoring.prometheus.retention }}
        - --web.enable-lifecycle
        - --web.enable-remote-write-receiver
        volumeMounts:
        - name: prometheus-config
          mountPath: /etc/prometheus
        - name: prometheus-storage
          mountPath: /prometheus
        resources:
          {{- toYaml .Values.monitoring.prometheus.resources | nindent 10 }}
        securityContext:
          {{- toYaml .Values.securityContext | nindent 10 }}
      volumes:
      - name: prometheus-config
        configMap:
          name: prometheus-config
      - name: prometheus-storage
        emptyDir: {}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
{{- end }} 