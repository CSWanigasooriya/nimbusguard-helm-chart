{{- if .Values.monitoring.loki.enabled }}
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: loki-config
  namespace: {{ .Values.namespace.name }}
  labels:
    {{- include "nimbusguard.labels" . | nindent 4 }}
    component: monitoring
data:
  local-config.yaml: |
    auth_enabled: false
    server:
      http_listen_port: 3100
      log_level: info
    
    common:
      path_prefix: /loki
      storage:
        filesystem:
          chunks_directory: /loki/chunks
          rules_directory: /loki/rules
      replication_factor: 1
      ring:
        instance_addr: 127.0.0.1
        kvstore:
          store: inmemory
    
    memberlist:
      join_members: []
    
    schema_config:
      configs:
        - from: 2024-04-01
          store: tsdb
          object_store: filesystem
          schema: v13
          index:
            prefix: loki_index_
            period: 24h
    
    storage_config:
      tsdb_shipper:
        active_index_directory: /loki/tsdb-index
        cache_location: /loki/tsdb-cache
      filesystem:
        directory: /loki/chunks
    
    limits_config:
      allow_structured_metadata: true
      volume_enabled: true
      retention_period: {{ .Values.monitoring.loki.retention }}
    
    table_manager:
      retention_deletes_enabled: true
      retention_period: {{ .Values.monitoring.loki.retention }}
    
    compactor:
      working_directory: /loki/compactor
      compaction_interval: 10m
      retention_enabled: true
      retention_delete_delay: 2h
      retention_delete_worker_count: 150
      delete_request_store: filesystem
    
    # Enable native OTLP ingestion
    distributor:
      ring:
        kvstore:
          store: inmemory
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: loki
  namespace: {{ .Values.namespace.name }}
  labels:
    {{- include "nimbusguard.labels" . | nindent 4 }}
    app.kubernetes.io/name: loki
    component: monitoring
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: loki
  template:
    metadata:
      labels:
        {{- include "nimbusguard.labels" . | nindent 8 }}
        app.kubernetes.io/name: loki
        component: monitoring
    spec:
      containers:
      - name: loki
        image: {{ include "nimbusguard.image" (dict "repository" .Values.monitoring.loki.image.repository "tag" .Values.monitoring.loki.image.tag "Values" .Values) }}
        ports:
        - containerPort: 3100
        args:
        - -config.file=/etc/loki/local-config.yaml
        volumeMounts:
        - name: loki-config
          mountPath: /etc/loki
        - name: loki-storage
          mountPath: /loki
        resources:
          {{- toYaml .Values.monitoring.loki.resources | nindent 10 }}
      volumes:
      - name: loki-config
        configMap:
          name: loki-config
      - name: loki-storage
        emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: loki
  namespace: {{ .Values.namespace.name }}
  labels:
    {{- include "nimbusguard.labels" . | nindent 4 }}
    app.kubernetes.io/name: loki
    component: monitoring
spec:
  selector:
    app.kubernetes.io/name: loki
  ports:
  - name: http
    port: {{ .Values.monitoring.loki.service.port }}
    targetPort: 3100
  type: {{ .Values.monitoring.loki.service.type }}
{{- end }}

{{- if .Values.monitoring.tempo.enabled }}
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: tempo-config
  namespace: {{ .Values.namespace.name }}
  labels:
    {{- include "nimbusguard.labels" . | nindent 4 }}
    component: monitoring
data:
  tempo.yaml: |
    server:
      http_listen_port: 3200
    
    distributor:
      receivers:
        otlp:
          protocols:
            grpc:
              endpoint: 0.0.0.0:4317
            http:
              endpoint: 0.0.0.0:4318
    
    ingester:
      trace_idle_period: 10s
      max_block_bytes: 1_000_000
      max_block_duration: 5m
    
    compactor:
      compaction:
        compaction_window: 1h
        max_compaction_objects: 1000000
        block_retention: 1h
        compacted_block_retention: 10m
    
    storage:
      trace:
        backend: local
        local:
          path: /tmp/tempo/traces
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: tempo
  namespace: {{ .Values.namespace.name }}
  labels:
    {{- include "nimbusguard.labels" . | nindent 4 }}
    app.kubernetes.io/name: tempo
    component: monitoring
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: tempo
  template:
    metadata:
      labels:
        {{- include "nimbusguard.labels" . | nindent 8 }}
        app.kubernetes.io/name: tempo
        component: monitoring
    spec:
      containers:
      - name: tempo
        image: {{ include "nimbusguard.image" (dict "repository" .Values.monitoring.tempo.image.repository "tag" .Values.monitoring.tempo.image.tag "Values" .Values) }}
        ports:
        - containerPort: {{ .Values.monitoring.tempo.service.ports.http }}
        - containerPort: {{ .Values.monitoring.tempo.service.ports.otlpGrpc }}
        - containerPort: {{ .Values.monitoring.tempo.service.ports.otlpHttp }}
        args:
        - -config.file=/etc/tempo/tempo.yaml
        volumeMounts:
        - name: tempo-config
          mountPath: /etc/tempo
        - name: tempo-storage
          mountPath: /tmp/tempo
        resources:
          {{- toYaml .Values.monitoring.tempo.resources | nindent 10 }}
      volumes:
      - name: tempo-config
        configMap:
          name: tempo-config
      - name: tempo-storage
        emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: tempo
  namespace: {{ .Values.namespace.name }}
  labels:
    {{- include "nimbusguard.labels" . | nindent 4 }}
    app.kubernetes.io/name: tempo
    component: monitoring
spec:
  selector:
    app.kubernetes.io/name: tempo
  ports:
  - name: http
    port: {{ .Values.monitoring.tempo.service.ports.http }}
    targetPort: {{ .Values.monitoring.tempo.service.ports.http }}
  - name: otlp-grpc
    port: {{ .Values.monitoring.tempo.service.ports.otlpGrpc }}
    targetPort: {{ .Values.monitoring.tempo.service.ports.otlpGrpc }}
  - name: otlp-http
    port: {{ .Values.monitoring.tempo.service.ports.otlpHttp }}
    targetPort: {{ .Values.monitoring.tempo.service.ports.otlpHttp }}
  type: {{ .Values.monitoring.tempo.service.type }}
{{- end }}

{{- if .Values.monitoring.grafana.enabled }}
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-config
  namespace: {{ .Values.namespace.name }}
  labels:
    {{- include "nimbusguard.labels" . | nindent 4 }}
    component: monitoring
data:
  datasources.yaml: |
    apiVersion: 1
    datasources:
    - name: Prometheus
      type: prometheus
      access: proxy
      url: http://prometheus:9090
      isDefault: true
    - name: Loki
      type: loki
      access: proxy
      url: http://loki:3100
    - name: Tempo
      type: tempo
      access: proxy
      url: http://tempo:3200
      jsonData:
        tracesToLogs:
          datasourceUid: loki
        tracesToMetrics:
          datasourceUid: prometheus
        serviceMap:
          datasourceUid: prometheus
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: grafana
  namespace: {{ .Values.namespace.name }}
  labels:
    {{- include "nimbusguard.labels" . | nindent 4 }}
    app.kubernetes.io/name: grafana
    component: monitoring
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: grafana
  template:
    metadata:
      labels:
        {{- include "nimbusguard.labels" . | nindent 8 }}
        app.kubernetes.io/name: grafana
        component: monitoring
    spec:
      containers:
      - name: grafana
        image: {{ include "nimbusguard.image" (dict "repository" .Values.monitoring.grafana.image.repository "tag" .Values.monitoring.grafana.image.tag "Values" .Values) }}
        ports:
        - containerPort: 3000
        env:
        - name: GF_SECURITY_ADMIN_PASSWORD
          value: {{ .Values.monitoring.grafana.adminPassword | quote }}
        volumeMounts:
        - name: grafana-config
          mountPath: /etc/grafana/provisioning
        resources:
          {{- toYaml .Values.monitoring.grafana.resources | nindent 10 }}
      volumes:
      - name: grafana-config
        configMap:
          name: grafana-config
---
apiVersion: v1
kind: Service
metadata:
  name: grafana
  namespace: {{ .Values.namespace.name }}
  labels:
    {{- include "nimbusguard.labels" . | nindent 4 }}
    app.kubernetes.io/name: grafana
    component: monitoring
spec:
  selector:
    app.kubernetes.io/name: grafana
  ports:
  - name: http
    port: {{ .Values.monitoring.grafana.service.port }}
    targetPort: 3000
  type: {{ .Values.monitoring.grafana.service.type }}
{{- end }} 