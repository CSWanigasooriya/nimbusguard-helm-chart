{{- if .Values.monitoring.alloy.enabled }}
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: alloy
  namespace: {{ .Values.namespace.name }}
  labels:
    {{- include "nimbusguard.labels" . | nindent 4 }}
    component: monitoring
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ include "nimbusguard.fullname" . }}-alloy
  labels:
    {{- include "nimbusguard.labels" . | nindent 4 }}
    component: monitoring
rules:
- apiGroups: [""]
  resources:
  - nodes
  - nodes/proxy
  - nodes/metrics
  - services
  - endpoints
  - pods
  - pods/log
  verbs: ["get", "list", "watch"]
- apiGroups: [""]
  resources:
  - configmaps
  verbs: ["get"]
- apiGroups:
  - networking.k8s.io
  resources:
  - ingresses
  verbs: ["get", "list", "watch"]
- nonResourceURLs: ["/metrics"]
  verbs: ["get"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ include "nimbusguard.fullname" . }}-alloy
  labels:
    {{- include "nimbusguard.labels" . | nindent 4 }}
    component: monitoring
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: {{ include "nimbusguard.fullname" . }}-alloy
subjects:
- kind: ServiceAccount
  name: alloy
  namespace: {{ .Values.namespace.name }}
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: alloy-config
  namespace: {{ .Values.namespace.name }}
  labels:
    {{- include "nimbusguard.labels" . | nindent 4 }}
    component: monitoring
data:
  config.alloy: |
    // ============= METRICS =============
    // Prometheus metrics forwarding
    prometheus.remote_write "default" {
      endpoint {
        url = "http://prometheus:9090/api/v1/write"
      }
    }

    // Discover Kubernetes Services  
    discovery.kubernetes "services" {
      role = "service"
    }

    // Discover Kubernetes Pods for metric scraping
    discovery.kubernetes "pods" {
      role = "pod"
    }

    // Scrape NimbusGuard consumer service
    prometheus.scrape "nimbusguard_consumer" {
      targets = [
        {
          __address__ = "consumer:{{ .Values.consumer.service.port }}",
          __metrics_path__ = "/metrics",
        },
      ]
      forward_to = [prometheus.remote_write.default.receiver]
      scrape_interval = "30s"
    }

    // ============= LOGS =============
    // Loki log forwarding
    loki.write "default" {
      endpoint {
        url = "http://loki:3100/loki/api/v1/push"
      }
    }

    // Discover pods for log collection
    discovery.kubernetes "pods_logs" {
      role = "pod"
    }

    // Collect container logs automatically
    loki.source.kubernetes "pods" {
      targets    = discovery.kubernetes.pods_logs.targets
      forward_to = [loki.process.add_labels.receiver]
    }

    // Add useful labels to logs
    loki.process "add_labels" {
      forward_to = [loki.write.default.receiver]

      stage.docker {}
      
      stage.labels {
        values = {
          namespace = "__meta_kubernetes_namespace",
          pod       = "__meta_kubernetes_pod_name",
          container = "__meta_kubernetes_container_name",
          app       = "__meta_kubernetes_pod_label_app_kubernetes_io_name",
        }
      }
    }

    // ============= TRACES =============
    // OpenTelemetry traces forwarding to Tempo  
    otelcol.receiver.otlp "default" {
      grpc {
        endpoint = "0.0.0.0:4317"
      }
      http {
        endpoint = "0.0.0.0:4318"
      }
      output {
        traces  = [otelcol.exporter.otlp.tempo.input]
        metrics = [otelcol.processor.batch.default.input]
        logs    = [otelcol.processor.batch.logs.input]
      }
    }

    // Process and forward OTLP metrics to Prometheus
    otelcol.processor.batch "default" {
      timeout = "1s"
      send_batch_size = 512
      output {
        metrics = [otelcol.exporter.prometheus.default.input]
      }
    }

    // Process and forward OTLP logs to Loki
    otelcol.processor.batch "logs" {
      output {
        logs = [otelcol.exporter.loki.default.input]
      }
    }

    otelcol.exporter.prometheus "default" {
      forward_to = [prometheus.remote_write.default.receiver]
    }

    otelcol.exporter.loki "default" {
      forward_to = [loki.write.default.receiver]
    }

    otelcol.exporter.otlp "tempo" {
      client {
        endpoint = "http://tempo:4317"
        tls {
          insecure = true
        }
      }
    }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: alloy
  namespace: {{ .Values.namespace.name }}
  labels:
    {{- include "nimbusguard.labels" . | nindent 4 }}
    app.kubernetes.io/name: alloy
    component: monitoring
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: alloy
  template:
    metadata:
      labels:
        {{- include "nimbusguard.labels" . | nindent 8 }}
        app.kubernetes.io/name: alloy
        component: monitoring
    spec:
      serviceAccountName: alloy
      containers:
      - name: alloy
        image: {{ include "nimbusguard.image" (dict "repository" .Values.monitoring.alloy.image.repository "tag" .Values.monitoring.alloy.image.tag "Values" .Values) }}
        ports:
        - containerPort: {{ .Values.monitoring.alloy.service.ports.metrics }}
          name: http-metrics
        - containerPort: 8081
          name: http-pprof
        - containerPort: {{ .Values.monitoring.alloy.service.ports.otlpGrpc }}
          name: otlp-grpc
        - containerPort: {{ .Values.monitoring.alloy.service.ports.otlpHttp }}
          name: otlp-http
        args:
        - run
        - /etc/alloy/config.alloy
        - --server.http.listen-addr=0.0.0.0:{{ .Values.monitoring.alloy.service.ports.metrics }}
        - --cluster.enabled=false
        volumeMounts:
        - name: alloy-config
          mountPath: /etc/alloy
        resources:
          {{- toYaml .Values.monitoring.alloy.resources | nindent 10 }}
        env:
        - name: HOSTNAME
          valueFrom:
            fieldRef:
              fieldPath: spec.nodeName
      volumes:
      - name: alloy-config
        configMap:
          name: alloy-config
---
apiVersion: v1
kind: Service
metadata:
  name: alloy
  namespace: {{ .Values.namespace.name }}
  labels:
    {{- include "nimbusguard.labels" . | nindent 4 }}
    app.kubernetes.io/name: alloy
    component: monitoring
spec:
  selector:
    app.kubernetes.io/name: alloy
  ports:
  - name: http-metrics
    port: {{ .Values.monitoring.alloy.service.ports.metrics }}
    targetPort: {{ .Values.monitoring.alloy.service.ports.metrics }}
    protocol: TCP
  - name: otlp-grpc
    port: {{ .Values.monitoring.alloy.service.ports.otlpGrpc }}
    targetPort: {{ .Values.monitoring.alloy.service.ports.otlpGrpc }}
    protocol: TCP
  - name: otlp-http
    port: {{ .Values.monitoring.alloy.service.ports.otlpHttp }}
    targetPort: {{ .Values.monitoring.alloy.service.ports.otlpHttp }}
    protocol: TCP
  type: {{ .Values.monitoring.alloy.service.type }}
{{- end }} 