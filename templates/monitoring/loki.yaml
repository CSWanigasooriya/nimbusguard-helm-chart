{{- if .Values.monitoring.loki.enabled }}
{{/* Custom Loki deployment when not using chart dependency */}}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "nimbusguard.fullname" . }}-loki-config
  namespace: {{ .Values.monitoring.loki.namespace | default "monitoring" }}
  labels:
    {{- include "nimbusguard.labels" . | nindent 4 }}
    app.kubernetes.io/component: loki
  annotations:
    {{- include "nimbusguard.workloadHookAnnotations" . | nindent 4 }}
data:
  loki.yml: |
    auth_enabled: {{ .Values.monitoring.loki.config.authEnabled | default false }}

    server:
      http_listen_port: {{ .Values.monitoring.loki.config.httpPort | default 3100 }}
      grpc_listen_port: {{ .Values.monitoring.loki.config.grpcPort | default 9096 }}
      log_level: {{ .Values.monitoring.loki.config.logLevel | default "info" }}

    common:
      path_prefix: {{ .Values.monitoring.loki.config.pathPrefix | default "/tmp/loki" }}
      storage:
        filesystem:
          chunks_directory: {{ .Values.monitoring.loki.config.chunksDirectory | default "/tmp/loki/chunks" }}
          rules_directory: {{ .Values.monitoring.loki.config.rulesDirectory | default "/tmp/loki/rules" }}
      replication_factor: {{ .Values.monitoring.loki.config.replicationFactor | default 1 }}
      ring:
        instance_addr: 127.0.0.1
        kvstore:
          store: inmemory

    query_range:
      results_cache:
        cache:
          embedded_cache:
            enabled: true
            max_size_mb: {{ .Values.monitoring.loki.config.cacheMaxSizeMb | default 100 }}

    schema_config:
      configs:
        - from: {{ .Values.monitoring.loki.config.schemaFrom | default "2020-10-24" }}
          store: boltdb-shipper
          object_store: filesystem
          schema: v11
          index:
            prefix: index_
            period: 24h

    ruler:
      alertmanager_url: {{ .Values.monitoring.loki.config.alertmanagerUrl | default "http://localhost:9093" }}
      storage:
        type: local
        local:
          directory: {{ .Values.monitoring.loki.config.rulesDirectory | default "/tmp/loki/rules" }}
      rule_path: {{ .Values.monitoring.loki.config.rulePath | default "/tmp/loki/rules-temp" }}
      ring:
        kvstore:
          store: inmemory
      enable_api: true

    limits_config:
      enforce_metric_name: false
      reject_old_samples: true
      reject_old_samples_max_age: 168h
      max_cache_freshness_per_query: 10m
      split_queries_by_interval: 15m
      ingestion_rate_mb: {{ .Values.monitoring.loki.config.ingestionRateMb | default 16 }}
      ingestion_burst_size_mb: {{ .Values.monitoring.loki.config.ingestionBurstSizeMb | default 24 }}

    # Analytics configuration for NimbusGuard
    analytics:
      reporting_enabled: {{ .Values.monitoring.loki.config.reportingEnabled | default false }}
      
    # Table manager for retention
    table_manager:
      retention_deletes_enabled: {{ .Values.monitoring.loki.config.retentionDeletesEnabled | default true }}
      retention_period: {{ .Values.monitoring.loki.config.retentionPeriod | default "168h" }}
---
{{- if .Values.monitoring.loki.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "nimbusguard.fullname" . }}-loki
  namespace: {{ .Values.monitoring.loki.namespace | default "monitoring" }}
  labels:
    {{- include "nimbusguard.labels" . | nindent 4 }}
    app.kubernetes.io/component: loki
  annotations:
    {{- include "nimbusguard.workloadHookAnnotations" . | nindent 4 }}
spec:
  replicas: {{ .Values.monitoring.loki.replicaCount | default 1 }}
  selector:
    matchLabels:
      {{- include "nimbusguard.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: loki
  template:
    metadata:
      labels:
        {{- include "nimbusguard.labels" . | nindent 8 }}
        app.kubernetes.io/component: loki
    spec:
      containers:
        - name: loki
          image: "{{ .Values.monitoring.loki.image.repository | default "grafana/loki" }}:{{ .Values.monitoring.loki.image.tag | default "2.9.0" }}"
          imagePullPolicy: {{ .Values.monitoring.loki.image.pullPolicy | default "IfNotPresent" }}
          args:
            - '-config.file=/etc/loki/loki.yml'
          ports:
            - containerPort: {{ .Values.monitoring.loki.config.httpPort | default 3100 }}
              name: http
            - containerPort: {{ .Values.monitoring.loki.config.grpcPort | default 9096 }}
              name: grpc
          volumeMounts:
            - name: loki-config
              mountPath: /etc/loki
            - name: loki-storage
              mountPath: /tmp/loki
          resources:
            {{- toYaml (.Values.monitoring.loki.resources | default (dict "requests" (dict "cpu" "100m" "memory" "128Mi") "limits" (dict "cpu" "500m" "memory" "512Mi"))) | nindent 12 }}
          readinessProbe:
            httpGet:
              path: /ready
              port: {{ .Values.monitoring.loki.config.httpPort | default 3100 }}
            initialDelaySeconds: 45
          livenessProbe:
            httpGet:
              path: /ready
              port: {{ .Values.monitoring.loki.config.httpPort | default 3100 }}
            initialDelaySeconds: 45
      volumes:
        - name: loki-config
          configMap:
            name: {{ include "nimbusguard.fullname" . }}-loki-config
        - name: loki-storage
          {{- if .Values.monitoring.loki.persistence.enabled }}
          persistentVolumeClaim:
            claimName: {{ include "nimbusguard.fullname" . }}-loki-storage
          {{- else }}
          emptyDir: {}
          {{- end }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "nimbusguard.fullname" . }}-loki
  namespace: {{ .Values.monitoring.loki.namespace | default "monitoring" }}
  labels:
    {{- include "nimbusguard.labels" . | nindent 4 }}
    app.kubernetes.io/component: loki
  annotations:
    {{- include "nimbusguard.workloadHookAnnotations" . | nindent 4 }}
spec:
  type: {{ .Values.monitoring.loki.service.type | default "ClusterIP" }}
  selector:
    {{- include "nimbusguard.selectorLabels" . | nindent 4 }}
    app.kubernetes.io/component: loki
  ports:
    - name: http
      port: {{ .Values.monitoring.loki.config.httpPort | default 3100 }}
      targetPort: {{ .Values.monitoring.loki.config.httpPort | default 3100 }}
    - name: grpc
      port: {{ .Values.monitoring.loki.config.grpcPort | default 9096 }}
      targetPort: {{ .Values.monitoring.loki.config.grpcPort | default 9096 }}
{{- end }}
{{- end }}
