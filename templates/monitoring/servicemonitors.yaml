{{- if or .Values.monitoring.prometheus.enabled .Values.dependencies.prometheus.enabled }}
{{/* ServiceMonitor for NimbusGuard Operator */}}
{{- if .Values.operator.enabled }}
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: {{ include "nimbusguard.fullname" . }}-operator
  namespace: {{ include "nimbusguard.namespace" . }}
  labels:
    {{- include "nimbusguard.operatorLabels" . | nindent 4 }}
  annotations:
    {{- include "nimbusguard.workloadHookAnnotations" . | nindent 4 }}
spec:
  selector:
    matchLabels:
      {{- include "nimbusguard.operatorSelectorLabels" . | nindent 6 }}
  endpoints:
  - port: {{ .Values.operator.service.name }}
    interval: 30s
    path: /metrics
    scheme: http
---
{{- end }}

{{/* ServiceMonitor for Consumer Workload */}}
{{- if .Values.consumerWorkload.enabled }}
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: {{ include "nimbusguard.fullname" . }}-consumer-workload
  namespace: {{ include "nimbusguard.namespace" . }}
