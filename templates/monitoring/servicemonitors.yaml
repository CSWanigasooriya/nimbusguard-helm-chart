    {{- include "nimbusguard.workloadHookAnnotations" . | nindent 4 }}
spec:
  selector:
    matchLabels:
      {{- include "nimbusguard.consumerWorkloadSelectorLabels" . | nindent 6 }}
  endpoints:
  - port: {{ .Values.consumerWorkload.service.name }}
    interval: 30s
    path: /metrics
    scheme: http
---
{{- end }}

{{/* ServiceMonitor for Load Generator */}}
{{- if .Values.loadGenerator.enabled }}
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
