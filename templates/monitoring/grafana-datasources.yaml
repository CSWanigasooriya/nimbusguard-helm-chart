{{- if or .Values.dependencies.grafana.enabled .Values.monitoring.grafana.enabled }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "nimbusguard.fullname" . }}-grafana-datasources
  namespace: {{ .Values.monitoring.grafana.namespace | default "monitoring" }}
  labels:
    {{- include "nimbusguard.labels" . | nindent 4 }}
    grafana_datasource: "1"
  annotations:
    {{- include "nimbusguard.workloadHookAnnotations" . | nindent 4 }}
data:
  datasources.yml: |
    apiVersion: 1
    deleteDatasources:
      - name: NimbusGuard-Prometheus
        orgId: 1
      - name: NimbusGuard-Loki  
        orgId: 1
      - name: NimbusGuard-Tempo
        orgId: 1
    datasources:
      - name: NimbusGuard-Prometheus
        type: prometheus
        access: proxy
        orgId: 1
        url: {{ .Values.monitoring.prometheus.url | default "http://prometheus.monitoring.svc.cluster.local:9090" }}
        basicAuth: false
        isDefault: {{ .Values.monitoring.prometheus.isDefault | default true }}
        version: 1
        editable: false
        jsonData:
          httpMethod: GET
          prometheusType: Prometheus
          prometheusVersion: 2.47.0
          cacheLevel: 'High'
          disableMetricsLookup: false
          incrementalQuerying: false
          exemplarTraceIdDestinations:
            - name: trace_id
              datasourceUid: nimbusguard-tempo
              url: '$${__value.raw}'
        uid: nimbusguard-prometheus
        
      {{- if .Values.monitoring.loki.enabled }}
      - name: NimbusGuard-Loki
        type: loki
        access: proxy
        orgId: 1
        url: {{ .Values.monitoring.loki.url | default "http://loki.monitoring.svc.cluster.local:3100" }}
        basicAuth: false
        isDefault: false
        version: 1
        editable: false
        jsonData:
          maxLines: 1000
          derivedFields:
            - datasourceUid: nimbusguard-tempo
              matcherRegex: "(?:traceID|trace_id)=(\\w+)"
              name: TraceID
              url: '$${__value.raw}'
              urlDisplayLabel: 'View Trace'
        uid: nimbusguard-loki
      {{- end }}
      
      {{- if .Values.monitoring.tempo.enabled }}
      - name: NimbusGuard-Tempo
        type: tempo
        access: proxy
        orgId: 1
        url: {{ .Values.monitoring.tempo.url | default "http://tempo.monitoring.svc.cluster.local:3200" }}
        basicAuth: false
        isDefault: false
        version: 1
        editable: false
        jsonData:
          httpMethod: GET
          serviceMap:
            datasourceUid: nimbusguard-prometheus
          search:
            hide: false
          nodeGraph:
            enabled: true
          traceQuery:
            timeShiftEnabled: true
            spanStartTimeShift: 1h
            spanEndTimeShift: 1h
          spanBar:
            type: Tag
            tag: http.path
          lokiSearch:
            datasourceUid: nimbusguard-loki
        uid: nimbusguard-tempo
      {{- end }}
{{- end }}
