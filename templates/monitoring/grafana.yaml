{{- if .Values.monitoring.grafana.enabled }}
---
# Grafana ConfigMap
apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-config
  namespace: {{ .Values.namespace.name }}
  labels:
    {{- include "nimbusguard.labels" . | nindent 4 }}
    component: monitoring
data:
  datasources.yaml: |
    apiVersion: 1
    deleteDatasources:
      - name: Prometheus
      - name: Loki  
      - name: Tempo
    datasources:
    - name: Prometheus
      type: prometheus
      access: proxy
      url: http://prometheus:9090
      isDefault: true
      editable: false
      orgId: 1
      uid: prometheus
      jsonData:
        httpMethod: POST
        prometheusType: Prometheus
        prometheusVersion: 2.40.0
        cacheLevel: 'High'
    - name: Loki
      type: loki
      access: proxy
      url: http://loki:3100
      editable: false
      orgId: 1
      uid: loki
      jsonData:
        maxLines: 1000
    - name: Tempo
      type: tempo
      access: proxy
      url: http://tempo:3200
      editable: false
      orgId: 1
      uid: tempo
      jsonData:
        tracesToLogs:
          datasourceUid: loki
          filterByTraceID: true
          filterBySpanID: true
        tracesToMetrics:
          datasourceUid: prometheus
        serviceMap:
          datasourceUid: prometheus
        search:
          hide: false
        nodeGraph:
          enabled: true
---
# Grafana Dashboards ConfigMap (placeholder)
apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-dashboards
  namespace: {{ .Values.namespace.name }}
  labels:
    {{- include "nimbusguard.labels" . | nindent 4 }}
    component: monitoring
data:
  # Dashboards will be added here or via separate ConfigMaps
  placeholder.json: |
    {
      "dashboard": {},
      "folderId": 0,
      "overwrite": true
    }
---
# Grafana Service
apiVersion: v1
kind: Service
metadata:
  name: grafana
  namespace: {{ .Values.namespace.name }}
  labels:
    {{- include "nimbusguard.labels" . | nindent 4 }}
    component: monitoring
spec:
  type: {{ .Values.monitoring.grafana.service.type }}
  ports:
    - port: {{ .Values.monitoring.grafana.service.port }}
      targetPort: 3000
      protocol: TCP
      name: http
  selector:
    {{- include "nimbusguard.selectorLabels" . | nindent 4 }}
    app.kubernetes.io/name: grafana
---
# Grafana Deployment
apiVersion: apps/v1
kind: Deployment
metadata:
  name: grafana
  namespace: {{ .Values.namespace.name }}
  labels:
    {{- include "nimbusguard.labels" . | nindent 4 }}
    component: monitoring
spec:
  replicas: 1
  selector:
    matchLabels:
      {{- include "nimbusguard.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/name: grafana
  template:
    metadata:
      labels:
        {{- include "nimbusguard.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/name: grafana
        component: monitoring
    spec:
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      containers:
      - name: grafana
        image: "{{ .Values.monitoring.grafana.image.repository }}:{{ .Values.monitoring.grafana.image.tag }}"
        imagePullPolicy: {{ .Values.monitoring.grafana.image.pullPolicy }}
        ports:
        - containerPort: 3000
          name: http
        env:
        - name: GF_SECURITY_ADMIN_PASSWORD
          value: {{ .Values.monitoring.grafana.auth.adminPassword | quote }}
        - name: GF_SECURITY_ADMIN_USER
          value: {{ .Values.monitoring.grafana.auth.adminUser | quote }}
        - name: GF_USERS_ALLOW_SIGN_UP
          value: "false"
        - name: GF_INSTALL_PLUGINS
          value: "grafana-piechart-panel"
        - name: GF_FEATURE_TOGGLES_ENABLE
          value: "tempoSearch,tempoServiceGraph,correlations"
        volumeMounts:
        - name: grafana-config
          mountPath: /etc/grafana/provisioning/datasources
        - name: grafana-dashboards
          mountPath: /etc/grafana/provisioning/dashboards
        - name: grafana-dashboards
          mountPath: /var/lib/grafana/dashboards
        resources:
          {{- toYaml .Values.monitoring.grafana.resources | nindent 10 }}
        securityContext:
          {{- toYaml .Values.securityContext | nindent 10 }}
      volumes:
      - name: grafana-config
        configMap:
          name: grafana-config
      - name: grafana-dashboards
        configMap:
          name: grafana-dashboards
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
{{- end }} 