{{- if .Values.monitoring.nodeExporter.enabled }}
---
# Node Exporter Service
apiVersion: v1
kind: Service
metadata:
  name: node-exporter
  namespace: {{ .Values.namespace.name }}
  labels:
    {{- include "nimbusguard.labels" . | nindent 4 }}
    component: monitoring
spec:
  type: {{ .Values.monitoring.nodeExporter.service.type }}
  ports:
    - port: {{ .Values.monitoring.nodeExporter.service.port }}
      targetPort: 9100
      protocol: TCP
      name: metrics
  selector:
    {{- include "nimbusguard.selectorLabels" . | nindent 4 }}
    app.kubernetes.io/name: node-exporter
---
# Node Exporter DaemonSet
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: node-exporter
  namespace: {{ .Values.namespace.name }}
  labels:
    {{- include "nimbusguard.labels" . | nindent 4 }}
    component: monitoring
spec:
  selector:
    matchLabels:
      {{- include "nimbusguard.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/name: node-exporter
  template:
    metadata:
      labels:
        {{- include "nimbusguard.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/name: node-exporter
        component: monitoring
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "9100"
        prometheus.io/path: "/metrics"
    spec:
      hostPID: true
      hostIPC: true
      hostNetwork: true
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      containers:
      - name: node-exporter
        image: "{{ .Values.monitoring.nodeExporter.image.repository }}:{{ .Values.monitoring.nodeExporter.image.tag }}"
        imagePullPolicy: {{ .Values.monitoring.nodeExporter.image.pullPolicy }}
        args:
        - --path.procfs=/host/proc
        - --path.sysfs=/host/sys
        - --path.rootfs=/host/root
        - --collector.filesystem.mount-points-exclude=^/(sys|proc|dev|host|etc)($$|/)
        - --web.listen-address=0.0.0.0:9100
        ports:
        - containerPort: 9100
          name: metrics
          protocol: TCP
        resources:
          {{- toYaml .Values.monitoring.nodeExporter.resources | nindent 10 }}
        securityContext:
          {{- toYaml .Values.securityContext | nindent 10 }}
        volumeMounts:
        - name: proc
          mountPath: /host/proc
          readOnly: true
        - name: sys
          mountPath: /host/sys
          readOnly: true
        - name: root
          mountPath: /host/root
          mountPropagation: HostToContainer
          readOnly: true
      tolerations:
      - operator: Exists
        effect: NoSchedule
      - operator: Exists
        effect: NoExecute
      volumes:
      - name: proc
        hostPath:
          path: /proc
      - name: sys
        hostPath:
          path: /sys
      - name: root
        hostPath:
          path: /
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
{{- end }} 