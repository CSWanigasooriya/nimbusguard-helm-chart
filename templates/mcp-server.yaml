{{- if .Values.mcpServer.enabled }}
---
# MCP Server Service Account
{{- if .Values.mcpServer.serviceAccount.create }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "nimbusguard.mcpServer.serviceAccountName" . }}
  namespace: {{ .Values.namespace.name }}
  labels:
    {{- include "nimbusguard.labels" . | nindent 4 }}
    component: mcp-server
automountServiceAccountToken: {{ .Values.serviceAccount.automount }}
{{- end }}
---
# MCP Server RBAC
{{- if .Values.mcpServer.rbac.create }}
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ include "nimbusguard.fullname" . }}-mcp-server
  labels:
    {{- include "nimbusguard.labels" . | nindent 4 }}
    component: mcp-server
rules:
  - apiGroups: [""]
    resources: ["pods", "services", "endpoints", "nodes"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["apps"]
    resources: ["deployments", "replicasets", "daemonsets", "statefulsets"]
    verbs: ["get", "list", "watch"]
  - apiGroups: [""]
    resources: ["events"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["metrics.k8s.io"]
    resources: ["pods", "nodes"]
    verbs: ["get", "list"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ include "nimbusguard.fullname" . }}-mcp-server
  labels:
    {{- include "nimbusguard.labels" . | nindent 4 }}
    component: mcp-server
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: {{ include "nimbusguard.fullname" . }}-mcp-server
subjects:
  - kind: ServiceAccount
    name: {{ include "nimbusguard.mcpServer.serviceAccountName" . }}
    namespace: {{ .Values.namespace.name }}
{{- end }}
---
# MCP Server Service
apiVersion: v1
kind: Service
metadata:
  name: mcp-server
  namespace: {{ .Values.namespace.name }}
  labels:
    {{- include "nimbusguard.labels" . | nindent 4 }}
    component: mcp-server
spec:
  type: {{ .Values.mcpServer.service.type }}
  ports:
    - port: {{ .Values.mcpServer.service.port }}
      targetPort: 8080
      protocol: TCP
      name: http
  selector:
    {{- include "nimbusguard.selectorLabels" . | nindent 4 }}
    component: mcp-server
---
# MCP Server Deployment
apiVersion: apps/v1
kind: Deployment
metadata:
  name: mcp-server
  namespace: {{ .Values.namespace.name }}
  labels:
    {{- include "nimbusguard.labels" . | nindent 4 }}
    component: mcp-server
spec:
  replicas: 1
  selector:
    matchLabels:
      {{- include "nimbusguard.selectorLabels" . | nindent 6 }}
      component: mcp-server
  template:
    metadata:
      labels:
        {{- include "nimbusguard.selectorLabels" . | nindent 8 }}
        component: mcp-server
    spec:
      serviceAccountName: {{ include "nimbusguard.mcpServer.serviceAccountName" . }}
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      containers:
      - name: mcp-server
        image: "{{ .Values.mcpServer.image.repository }}:{{ .Values.mcpServer.image.tag }}"
        imagePullPolicy: {{ .Values.mcpServer.image.pullPolicy }}
        ports:
        - containerPort: 8080
          name: http
        env:
        - name: PYTHONUNBUFFERED
          value: "1"
        resources:
          {{- toYaml .Values.mcpServer.resources | nindent 10 }}
        securityContext:
          {{- toYaml .Values.securityContext | nindent 10 }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
{{- end }} 